# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

# Uncomment this if you are using SSL/TLS, running in Docker container, etc.
# http:
#   base_url: example.duckdns.org:8123

# Text to speech
tts:
  - platform: google_translate
homeassistant:
  customize: !include customize.yaml
  media_dirs:
    www: /config/www
    mail: /config/custom_components/mail_and_packages/images

group: !include_dir_merge_named ./groups
automation: !include automations.yaml
script: !include scripts.yaml
script secret: !include secret_scripts.yaml
scene: !include scenes.yaml
frontend:
  themes: !include_dir_merge_named ./themes

# temp fix for wyze 2026.7
additional_ca:
  digicert_g1_root: digicert_g1.crt

http:
  server_port: 80

media_player: !include_dir_merge_list ./media_players

spotcast:
  sp_dc: !secret sp_dc
  sp_key: !secret sp_key
  country: US #optional, added in 3.6.24

binary_sensor:
  - platform: wyzesense
    device: auto

sensor: !include_dir_merge_list ./sensors

template: !include ./template_sensors.yaml

light: !include ./lights.yaml

# var: !include variables.yaml

recorder:
  exclude:
    entities:
      - sensor.date_time_iso
      - sensor.time
      - sensor.timestamp
      - sensor.vehicle_state_data_sensor
      - sensor.climate_state_data_sensor
      - sensor.drive_state_data_sensor
      - sensor.gui_settings_data_sensor
      - sensor.sensor
      - sensor.software_data_sensor
      - sensor.speed_limit_data_sensor
      - sensor.vehicle_config_data_sensor

wyzeapi:
  username: !secret wyze_username
  password: !secret wyze_password
  sensors: false

switch:
  # - platform: switchmate
  #   mac: 'f3:7e:9f:7b:3e:95'
  # - platform: switchmate
  #   mac: 'f7:37:b9:d5:53:23'
  - platform: wake_on_lan
    mac: !secret nathan_pc_mac
    name: "Tater_PC"
    host: !secret nathan_pc_ip
    broadcast_address: !secret nathan_pc_ip

alarm_control_panel:
  - platform: manual
    name: Home Alarm
    code: !secret alarm_code
    disarmed:
      trigger_time: 0
    armed_home:
      arming_time: 0
      delay_time: 0

rest_command: !include rest_commands.yaml

camera: !include cameras.yaml
# image_processing: !include image_processing.yaml

shell_command:
  update_queue_page_redirect: >
    bash /config/change-queue-file.sh {{states('input_text.music_assistant_queue_guest_link') }}

  clear_queue_page: >
    bash /config/change-queue-file.sh no-queue.html

notify:
  - name: nathan_gmail
    platform: smtp
    server: "smtp.gmail.com"
    port: 587
    timeout: 15
    sender: !secret gmail_email
    encryption: starttls
    username: !secret gmail_email
    password: !secret gmail_password
    recipient:
      - !secret gmail_email
    sender_name: "Home Assistant"
