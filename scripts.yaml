notify_sarah_and_nathan:
  alias: Notify Sarah and Nathan
  fields:
    message:
      description: (required) The message to send to all of the devices
      example: Hello
      selector:
        text:
      required: true
    more_info:
      description: (optional) More information to display on phone notifications.
        Will not play over Alexa.
      example: Click here to for more info
      selector:
        text:
          multiline: true
    url:
      description: (optional) The url to open when the notification is clicked. Most
        often will be a specific dashboard.
      example: /lovelace/default_view
      selector:
        text:
    image:
      description: (optional) The public url of the image to be sent to the devices
      example: /local/mail_and_packages/mail_today.gif
      selector:
        text:
    use_alexa:
      description: Should this notification be made over the echos
      example: 'False'
      default: false
      selector:
        boolean:
      required: false
    use_persistent_notification:
      description: Should this notification be added to the HA sidebar
      example: 'False'
      default: false
      selector:
        boolean:
      required: false
    persistent_notification_id:
      description: The persistent notification id to use with the service.This allows
        the service to overwrite existing notifications with the same id
      example: water_leak_notification
      selector:
        text:
      required: false
    mobile_message_group:
      description: The group id used to visually group similar messages on mobile
      example: water-leak
      required: false
      selector:
        text:
    notify_sarah:
      description: Should this notification be sent to Sarah
      example: 'False'
      default: false
      selector:
        boolean:
      required: false
    notify_nathan:
      description: Should this notification be sent to Nathan
      example: 'False'
      default: false
      selector:
        boolean:
      required: false
    text_nathan:
      description: Should this notification be sent in an sms to Nathan
      example: 'False'
      default: false
      selector:
        boolean:
      required: false
    text_sarah:
      description: Should this notification be sent in an sms to Sarah
      example: 'False'
      default: false
      selector:
        boolean:
      required: false
    text_garrett:
      description: Should this notification be sent in an sms to Garrett
      example: 'False'
      default: false
      selector:
        boolean:
      required: false
    text_ice_contacts:
      description: Should this notification be sent in an sms to our emergency contacts
      example: 'False'
      default: false
      selector:
        boolean:
      required: false
    bypass_quiet_mode:
      description: Alexa is not used by default if quiet mode is on. Setting this
        field to true bypasses quiet mode.
      example: 'False'
      default: false
      selector:
        boolean:
      required: false
    notification_actions:
      name: Custom Actions (Optional)
      example: "- action: \"ALARM\" # The key you are sending for the event\n  title:
        \"Sound Alarm\" # The button title\n- action: \"URI\" # Must be set to URI
        if you plan to use a URI\n  title: \"Open Url\"\n  uri: \"https://google.com\"
        # URL to open when action is selected, can also be a lovelace view/dashboard"
      description: See [building-actionable-notifications](https://companion.home-assistant.io/docs/notifications/actionable-notifications#building-actionable-notifications)
      required: false
      selector:
        object:
    use_siren:
      selector:
        boolean: {}
      name: Use Siren
      description: Whether or not to sound the siren
      default: false
      required: false
    email_nathan:
      description: Should this notification be sent in an email to Nathan
      example: 'False'
      default: false
      selector:
        boolean:
      required: false
    notify_pine_private:
      selector:
        boolean: {}
      description: Whether or not to send a message on the Pine Private Meshtastic
        Channel
    print_receipt:
      selector:
        boolean: {}
      default: false
  variables:
    quiet_mode: '{{ not bypass_quiet_mode and is_state(''input_boolean.quiet_mode'',
      ''on'')}}'
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ notify_nathan | default(false) }}'
      sequence:
      - data:
          title: '{%- if more_info is defined -%}{{message}}{%- endif -%}'
          message: '{%- if more_info is defined -%}{{more_info}}{%- else -%}{{message}}{%-
            endif -%}'
          data:
            clickAction: '{{ url }}'
            image: '{{ image }}'
            actions: '{{ notification_actions }}'
            group: '{{ mobile_message_group}}'
        action: notify.mobile_app_pixel_10_pro
    default: []
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ use_alexa and not quiet_mode }}'
      sequence:
      - data_template:
          data:
            type: announce
          message: '{{ message }}'
        action: notify.alexa_media_everywhere
    default: []
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ notify_sarah | default(false)}}'
      sequence:
      - data:
          title: '{%- if more_info is defined -%}{{message}}{%- endif -%}'
          message: '{%- if more_info is defined -%}{{more_info}}{%- else -%}{{message}}{%-
            endif -%}'
          data:
            url: '{{ url }}'
            image: '{{ image }}'
            actions: ' {{ notification_actions }}'
            group: '{{ mobile_message_group}}'
        action: notify.mobile_app_iphone_68
  - choose:
    - conditions:
      - condition: template
        value_template: '{{text_nathan | default(false) or text_sarah | default(false)
          or text_ice_contacts | default(false) or text_garrett | default(false)}}'
      sequence:
      - continue_on_error: true
        data:
          contacts: '{% set contacts = [] %}

            {% if text_nathan %}{% set contacts = contacts + [''nathan''] %} {% endif
            %}

            {% if text_sarah %}{% set contacts = contacts + [''sarah''] %} {% endif
            %}

            {% if text_garrett %}{% set contacts = contacts + [''garrett''] %} {%
            endif %}


            {% if text_ice_contacts %}{% set contacts = contacts + [''ice''] %} {%
            endif %}

            {{contacts}}'
          message: '{{message}}


            {{more_info}}


            -----

            Automatically Sent from Nathan and Sarah''s Home Assistant'
        action: rest_command.text_message
    default: []
  - alias: Add persistent notification
    choose:
    - conditions:
      - condition: template
        value_template: '{{ use_persistent_notification and persistent_notification_id
          is defined}}'
      sequence:
      - data:
          title: '{%- if more_info is defined -%}{{message}}{%- endif -%}'
          message: '{%- if more_info is defined -%}{{more_info}}{%- else -%}{{message}}{%-
            endif -%} {%- if image is defined -%}{{"\n"}}{{"\n"}}![image]({{image}})
            {%- endif -%} {%- if url is defined -%}{{"\n"}}{{"\n"}}---{{"\n"}}{{"\n"}}[More
            Info]({{url}}) {%- endif -%}'
          notification_id: '{{persistent_notification_id}}'
        action: persistent_notification.create
    - conditions:
      - condition: template
        value_template: '{{ use_persistent_notification and not persistent_notification_id
          is defined }}'
      sequence:
      - data:
          title: '{%- if more_info is defined -%}{{message}}{%- endif -%}'
          message: '{%- if more_info is defined -%}{{more_info}}{%- else -%}{{message}}{%-
            endif -%} {%- if image is defined -%}{{"\n"}}{{"\n"}}![image]({{image}})
            {%- endif -%} {%- if url is defined -%}{{"\n"}}{{"\n"}}---{{"\n"}}{{"\n"}}[More
            Info]({{url}}) {%- endif -%}'
        action: persistent_notification.create
    default: []
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ use_siren | default(false) }}'
      sequence:
      - action: siren.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: siren.esp_siren_esp_siren
      - delay:
          hours: 0
          minutes: 0
          seconds: 30
      - action: siren.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: siren.esp_siren_esp_siren
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ email_nathan | default(false) }}'
      sequence:
      - action: notify.nathan_gmail
        data:
          title: '{%- if more_info is defined -%}{{message}}{%- endif -%}'
          message: "{%- if more_info is defined -%}{{more_info}}{%- else -%}{{message}}{%-
            endif\n -%}"
          data:
            html: "<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"
              \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"> <html lang=\"en\"
              xmlns=\"http://www.w3.org/1999/xhtml\"> <body> <p>{%- if more_info is
              defined -%}{{more_info}}{%- else -%}{{message}}{%- endif -%}</p>\n{%-
              if url is defined -%} <br/> <a href=\"{{ url }}\">More info</a> {%-
              endif -%}\n{%- if image is defined -%}\n    <br/>\n\n    <img src=\"{{
              image }}\"/>\n{%- endif -%}\n</body> </html>"
          target:
          - '{{states("input_text.nathan_email")}}'
    default: []
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ notify_pine_private | default(false) }}'
      sequence:
      - action: meshtastic.broadcast_channel_message
        continue_on_error: true
        data:
          ack: true
          channel: meshtastic.gateway_tree_channel_pineprivate
          message: '{% set m = message ~ ''\n\n'' ~ more_info %}

            {{m[:200]}}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ print_receipt | default(false) }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{more_info is defined}}'
        then:
        - action: escpos_printer.print_text
          continue_on_error: true
          metadata: {}
          data:
            text: '{{message}}'
            align: left
            cut: none
            feed: 2
            bold: true
          target:
            entity_id: notify.esc_pos_printer_192_168_3_131_9100
      - action: escpos_printer.print_text
        continue_on_error: true
        metadata: {}
        data:
          align: left
          text: '{%- if more_info is defined -%}{{more_info}}{%- else -%}{{message}}{%-
            endif -%}'
          bold: false
          cut: none
          feed: 2
        target:
          entity_id: notify.esc_pos_printer_192_168_3_131_9100
      - if:
        - condition: template
          value_template: '{{image is defined}}'
        then:
        - action: escpos_printer.print_image
          continue_on_error: true
          metadata: {}
          data:
            image: '{{ image }}'
            high_density: true
            align: center
            cut: none
            feed: 2
          target:
            entity_id: notify.esc_pos_printer_192_168_3_131_9100
      - if:
        - condition: template
          value_template: '{{url is defined}}'
        then:
        - action: escpos_printer.print_qr
          continue_on_error: true
          metadata: {}
          data:
            data: '{{url}}'
            size: 5
            ec: M
            align: center
            cut: none
            feed: 0
      - action: escpos_printer.print_text
        continue_on_error: true
        metadata: {}
        data:
          align: right
          text: '{% set current_time = now() %}

            {{ current_time.strftime(''%A, %B %d, %Y'') }}

            {{ current_time.strftime(''%I:%M:%S %p'') }}'
          bold: false
          cut: none
          feed: 0
        target:
          entity_id: notify.esc_pos_printer_192_168_3_131_9100
      - action: escpos_printer.feed
        continue_on_error: true
        metadata: {}
        data:
          lines: 2
        target:
          entity_id: notify.esc_pos_printer_192_168_3_131_9100
      - action: escpos_printer.cut
        continue_on_error: true
        metadata: {}
        data:
          mode: full
        target:
          entity_id: notify.esc_pos_printer_192_168_3_131_9100
      - action: escpos_printer.beep
        continue_on_error: true
        metadata: {}
        data:
          times: 3
          duration: 2
        target:
          entity_id: notify.esc_pos_printer_192_168_3_131_9100
  mode: queued
  max: 10
