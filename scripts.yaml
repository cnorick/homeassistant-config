ass:
  alias: Ass
  sequence:
  - data:
      data:
        type: tts
      message: ass
      target: group.alexa_everywhere
    service: notify.alexa_media
alexa_announce:
  alias: Alexa Announce
  sequence:
  - data_template:
      data:
        type: tts
      message: '{{ states.input_text.announcement_text.state }}'
      target: group.alexa_everywhere
    service: notify.alexa_media
alarm:
  alias: Alarm
  sequence:
  - data:
      brightness_pct: 100
      profile: relax
    entity_id: light.bedroom
    service: light.turn_on
  - data: {}
    entity_id: group.fans
    service: homeassistant.turn_off
  - service: input_boolean.turn_off
    data: {}
    entity_id: input_boolean.night_mode
  - data:
      volume_level: 0.8
    entity_id: media_player.bathroom_echo, media_player.bedroom_echo
    service: media_player.volume_set
  - data:
      source: Bedroom Echo
    service: media_player.select_source
    target:
      entity_id: media_player.spotify_nathan_orick
  - delay: 00:00:02
  - data:
      source: Bedroom Echo
    service: media_player.select_source
    target:
      entity_id: media_player.spotify_nathan_orick
  - continue_on_timeout: true
    timeout: 00:00:10
    wait_template: '{{ is_state_attr(''media_player.spotify_nathan_orick'', ''source'',
      ''Bedroom Echo'') }}'
  - data: {}
    entity_id: media_player.spotify_nathan_orick
    service: media_player.media_play_pause
  mode: single
slow_alarm:
  alias: Ease Lights on for Morning
  sequence:
  - data:
      brightness_pct: 100
      profile: relax
      transition: 900
    entity_id: light.sarah_s_nightstand, light.bedroom_ceiling, light.nathan_s_nightstand
    service: light.turn_on
  mode: single
notify_random:
  alias: Notify Random Person
  fields:
    title:
      description: The title of the notification
      example: State change
    message:
      description: The message content
      example: The light is on!
  sequence:
  - data_template:
      title: '{{title}}'
      message: '{{message}}'
    service: '{{ [''notify.mobile_app_pixel_7'', ''notify.mobile_app_iphone''] | random
      }}'
wake_tater_pc:
  alias: Wake Tater PC
  sequence:
  - service: switch.turn_on
    entity_id: switch.tater_pc
  mode: single
show_morning_dashboard:
  alias: Show Morning Dashboard
  sequence:
  - service: media_player.turn_on
    target:
      entity_id: media_player.living_room_tv_2
  - service: media_player.turn_on
    target:
      entity_id: media_player.chromecast
  - wait_for_trigger:
    - platform: state
      entity_id: media_player.chromecast
      for: 00:00:05
      to: idle
    timeout: 00:00:20
  - service: cast.show_lovelace_view
    data:
      entity_id: media_player.chromecast
      dashboard_path: lovelace2
      view_path: morning-dashboard
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - service: cast.show_lovelace_view
    data:
      entity_id: media_player.chromecast
      dashboard_path: lovelace
      view_path: morning-dashboard
  mode: single
alarm_beep_while_triggered:
  alias: Alarm -- Beep While Triggered
  sequence:
  - repeat:
      while:
      - condition: state
        entity_id: alarm_control_panel.home_alarm
        state: triggered
      sequence:
      - service: media_player.play_media
        data:
          media_content_type: sound
          media_content_id: buzzers_pistols_01
        target:
          entity_id:
          - media_player.guest_bathroom_echo
          - media_player.bedroom_echo
          - media_player.bedroom_tv_2
          - media_player.bathroom_echo
          - media_player.kitchen_echo_show
          - media_player.office_echo
          - media_player.living_room_echo
          - media_player.guest_bedroom_echo
      - delay:
          hours: 0
          minutes: 0
          seconds: 2
          milliseconds: 0
  mode: single
alarm_flash_while_triggered:
  alias: Alarm -- Flash Lights While Triggered
  sequence:
  - repeat:
      while:
      - condition: state
        entity_id: alarm_control_panel.home_alarm
        state: triggered
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: group.all_lights
            state: 'on'
          sequence:
          - service: light.turn_off
            target:
              entity_id: group.all_lights
            data: {}
        default:
        - service: light.turn_on
          data:
            effect: random
            brightness: 255
          target:
            entity_id: group.all_lights
        - service: light.turn_on
          target:
            entity_id: group.all_lights
          data:
            flash: long
      - delay:
          hours: 0
          minutes: 0
          seconds: 7
          milliseconds: 0
  mode: single
notify_sarah_leaving_work_or_arriving_home:
  alias: Notify Sarah Leaving Work or Arriving Home
  sequence:
  - wait_for_trigger:
    - platform: zone
      entity_id: person.sarah
      zone: zone.etsu
      event: leave
      id: work
    - platform: zone
      entity_id: person.sarah
      zone: zone.home
      event: enter
      id: home
    continue_on_timeout: false
    timeout: '1:00:00'
  - service: script.notify_sarah_and_nathan
    data:
      use_alexa: false
      notify_sarah: false
      notify_nathan: true
      text_nathan: false
      text_sarah: false
      text_ice_contacts: false
      bypass_quiet_mode: false
      message: Sarah's on her way
  mode: single
