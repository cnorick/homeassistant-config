start_tesla:
  alias: Start Tesla
  sequence:
  - action: climate.turn_on
    data: {}
    continue_on_error: true
    target:
      entity_id:
      - climate.tesleigh_lynn_climate
  - if:
    - condition: numeric_state
      entity_id: sensor.tesleigh_lynn_outside_temperature
      below: '45'
    then:
    - data:
        preset_mode: Defrost
      action: climate.set_preset_mode
      continue_on_error: true
      target:
        entity_id:
        - climate.tesleigh_lynn_climate
  mode: single
vacuum_rooms:
  alias: Vacuum Room(s)
  fields:
    rooms:
      name: Rooms
      description: The Rooms to Vacuum in the order that they should be vacuumed.
        Leave empty for vacuuming everywhere
      selector:
        select:
          multiple: true
          options:
          - Bedroom
          - Nursery
          - Hallway
          - Kitchen
          - Dining Room
          - Office
          - Laundry Room
          - Living Room
          - Bathroom
    repeat:
      selector:
        number:
          min: 1
          max: 5
      name: repeat
      default: 1
    overrideenablevacuumcheck:
      selector:
        boolean: {}
      name: overrideEnableVacuumCheck
      default: false
      required: false
  sequence:
  - condition: or
    conditions:
    - condition: template
      value_template: '{{overrideenablevacuumcheck}}'
    - condition: state
      entity_id: input_boolean.enable_vacuum
      state: 'on'
  - metadata: {}
    data: {}
    response_variable: maps
    action: roborock.get_maps
    target:
      entity_id: vacuum.roborock_s8_max_ultra
  - variables:
      segments: "{% set segToRoomDict = maps['vacuum.roborock_s8_max_ultra'].maps[0].rooms
        %}\n{% set data = namespace(roomToSegArr=[], segments=[]) %}\n{% for seg,
        room in segToRoomDict | items %}\n  {% set data.roomToSegArr = data.roomToSegArr
        + [(room | lower, seg)] %}\n{%- endfor -%}\n{% set data.roomsDict = dict.from_keys(data.roomToSegArr)
        %}\n\n{% for room in rooms %}\n  {% set data.segments = data.segments + [data.roomsDict[room
        | lower]]%}\n{%- endfor -%}\n\n{{data.segments}}"
  - metadata: {}
    data:
      command: app_segment_clean
      params:
      - segments: '{{segments}}'
        repeat: '{{times}}'
    action: vacuum.send_command
    target:
      entity_id: vacuum.roborock_s8_max_ultra
  mode: single
new_script:
  alias: Heat Coffee Water
  description: Turns on the water kettle and notifies when finished
  sequence:
  - service: switch.turn_on
    data: {}
    target:
      entity_id: switch.coffee_kettle
  - delay:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
  - if:
    - condition: numeric_state
      entity_id: sensor.coffee_kettle_current_consumption
      below: 100
    then:
    - service: switch.turn_off
      data: {}
      target:
        entity_id: switch.coffee_kettle
    - service: script.notify_sarah_and_nathan
      data:
        message: Kettle Turned Off
        use_alexa: false
        notify_nathan: true
        more_info: Check coffee kettle. There's probably no water in it, idiot. Or
          maybe the lever isn't down
    - stop: Kettle Stopped Heating
      error: true
  - wait_for_trigger:
    - platform: numeric_state
      entity_id: sensor.coffee_kettle_current_consumption
      below: 100
    timeout:
      hours: 0
      minutes: 8
      seconds: 0
      milliseconds: 0
    continue_on_timeout: true
  - if:
    - condition: numeric_state
      entity_id: sensor.coffee_kettle_current_consumption
      above: 100
    then:
    - service: script.notify_sarah_and_nathan
      data:
        message: Turning Kettle Off
        more_info: Kettle heated water for too long
        notify_nathan: true
    else:
    - if:
      - condition: state
        entity_id: input_boolean.night_mode
        state: 'off'
      then:
      - service: script.notify_sarah_and_nathan
        data:
          message: Coffee Ready
          use_alexa: true
          notify_nathan: true
      else:
      - service: script.notify_sarah_and_nathan
        data:
          message: Coffee Ready
          use_alexa: false
          notify_nathan: true
  - service: switch.turn_off
    data: {}
    target:
      entity_id: switch.coffee_kettle
  mode: single
start_tesla_and_turn_off_if_doesnt_leave_home:
  alias: Start Tesla and Turn Off If Doesn't Leave Home
  sequence:
  - if:
    - condition: state
      state: home
      entity_id: device_tracker.tesleigh_lynn_location
    then:
    - data: {}
      action: script.start_tesla
    - delay:
        hours: 0
        minutes: 12
        seconds: 0
        milliseconds: 0
    - if:
      - condition: state
        state: home
        entity_id: device_tracker.tesleigh_lynn_location
      then:
      - data:
          option: 'off'
        target:
          entity_id:
          - select.tesleigh_lynn_seat_heater_front_left
          - select.tesleigh_lynn_seat_heater_front_right
          - select.tesleigh_lynn_seat_heater_rear_center
          - select.tesleigh_lynn_seat_heater_rear_left
          - select.tesleigh_lynn_seat_heater_rear_right
        action: select.select_option
        enabled: false
      - data: {}
        target:
          entity_id:
          - switch.tesleigh_lynn_auto_steering_wheel_heater
        action: switch.turn_off
        enabled: false
      - data: {}
        target:
          entity_id:
          - climate.tesleigh_lynn_climate
        action: climate.turn_off
  mode: single
lock_front_door:
  alias: Lock Front Door
  sequence:
  - service: google_assistant_sdk.send_text_command
    data:
      command: Lock front door
  mode: single
vacuum_next_area:
  alias: Vacuum Next Area
  variables:
    room_list:
    - Bedroom
    - Nursery
    - Bathroom
  sequence:
  - if:
    - condition: state
      state: docked
      entity_id: vacuum.roborock_s8_max_ultra
    then:
    - data:
        rooms:
        - '{{states(''input_select.rooms_not_vacuumed_in_morning'')}}'
      action: script.vacuum_rooms
    - target:
        entity_id: input_select.rooms_not_vacuumed_in_morning
      data:
        cycle: true
      action: input_select.select_next
    else:
    - if:
      - condition: state
        state: error
        entity_id: vacuum.roborock_s8_max_ultra
      then:
      - data:
          use_alexa: false
          notify_sarah: false
          notify_nathan: true
          text_nathan: false
          text_sarah: false
          text_ice_contacts: false
          bypass_quiet_mode: false
          message: Rich Strike has an Error
        action: script.notify_sarah_and_nathan
      enabled: true
  mode: single
vacuum_until_condition_or_until_all_rooms_are_done:
  alias: Vacuum Until Condition or Until All Rooms Are Done
  sequence:
  - variables:
      first_room: states('counter.current_room_to_vacuum')
  - repeat:
      while:
      - condition: or
        conditions:
        - condition: template
          value_template: '{{not repeat.first and vacuum_until | int != states(''counter.current_room_to_vacuum'')
            | int}}'
          alias: If not the first loop && we haven't yet done all the rooms
      sequence: []
  fields:
    vacuum_until:
      name: Vacuum Until Condition
      description: The Vacuum will continue vacuuming until this condition is met
      required: false
      selector:
        condition:
  mode: single
