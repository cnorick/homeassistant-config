      target:
        entity_id: vacuum.roborock_s8_max_ultra
  - delay: 00:10:00
  - target:
      entity_id: '{{ lights }}'
    action: light.turn_off
    data: {}
  variables:
    lights:
    - light.front_porch
    - light.back_porch
    - light.side_porch
    - light.laundry_room
    - light.back_door
    - light.front_door
    - light.string_lights
    - light.h616c_745e
