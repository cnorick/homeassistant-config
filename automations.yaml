- id: wfh
  alias: Work from Home
  trigger:
  - platform: state
    entity_id: binary_sensor.is_during_workday
    from: 'off'
    to: 'on'
  - platform: state
    entity_id: input_boolean.wfh
    from: 'off'
    to: 'on'
  - platform: state
    entity_id: person.nathan
    from: not_home
    to: home
  - platform: state
    entity_id: person.sarah
    from: not_home
    to: home
  - platform: state
    entity_id: person.nathan
    from: home
    to: not_home
    id: nathan_left
  - platform: state
    entity_id: person.sarah
    from: home
    to: not_home
    id: sarah_left
  - platform: state
    entity_id: binary_sensor.occupied
    from: 'off'
    to: 'on'
  - platform: homeassistant
    event: start
  - platform: event
    event_type: automation_reloaded
  condition:
  - condition: state
    entity_id: input_boolean.wfh
    state: 'on'
  - condition: state
    entity_id: binary_sensor.is_during_workday
    state: 'on'
  - condition: state
    entity_id: binary_sensor.occupied
