      automation_blocker: input_boolean.people_outside
      light_target:
        entity_id: light.back_porch
      automation_blocker_boolean: false
      no_motion_wait: 300
- id: "1620360426386"
  alias: Home Alarm
  description: ""
  triggers:
    - trigger: state
      entity_id:
        - alarm_control_panel.alarmo
      to: pending
      id: alarm-pending
    - trigger: state
      entity_id:
        - alarm_control_panel.alarmo
      to: arming
      id: alarm-arming
    - trigger: state
      entity_id:
        - alarm_control_panel.alarmo
      to: disarmed
      id: alarm-disarmed
    - trigger: state
      entity_id:
        - alarm_control_panel.alarmo
      to: triggered
      id: alarm-triggered
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: DISARM_ALARM_NOW
      id: disarm-from-notification
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: TRIGGER_ALARM_NOW
      id: trigger-from-notification
    - trigger: state
      entity_id:
        - schedule.guard_mode_schedule
      to: "on"
      id: night-alarm-schedule-on
    - trigger: state
      entity_id:
        - schedule.guard_mode_schedule
      to: "off"
      id: night-alarm-schedule-off
    - trigger: state
      entity_id:
        - input_boolean.automatically_arm_at_night
      from: "off"
      to: "on"
      id: guard-mode-on
    - trigger: state
      entity_id:
        - input_boolean.automatically_arm_at_night
      from: "on"
      to: "off"
      id: guard-mode-off
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id:
                - public-space-motion
                - back-door-open
            - condition: state
              entity_id: alarm_control_panel.home_alarm
              state: armed_away
          sequence:
            - target:
                entity_id: alarm_control_panel.home_alarm
              action: alarm_control_panel.alarm_trigger
              data: {}
        - conditions:
            - condition: trigger
              id:
                - alarm-arming
                - alarm-pending
            - condition: state
              entity_id: alarm_control_panel.alarmo
              attribute: arm_mode
              state: armed_away
          sequence:
            - if:
                - condition: trigger
                  id:
                    - alarm-pending
              then:
                - action: script.notify_sarah_and_nathan
                  metadata: {}
                  data:
                    use_alexa: false
                    use_persistent_notification: false
                    notify_sarah: true
                    notify_nathan: true
                    text_nathan: false
                    text_sarah: false
                    text_garrett: false
                    text_ice_contacts: false
                    bypass_quiet_mode: false
                    use_siren: false
                    email_nathan: false
                    message: Alarm Pending
                    notification_actions:
                      - action: DISARM_ALARM_NOW
                        title: Disarm
                    more_info:
                      "Triggered by: {{state_attr('alarm_control_panel.alarmo',
                      'open_sensors')}}"
                - action: notify.alexa_media_kitchen_echo_show
                  metadata: {}
                  data:
                    message: Alarm Activated
            - action: browser_mod.navigate
              metadata: {}
              data:
                browser_id:
                  - f3b01d256ece808e760a985d55adef21
                path: /wall-panel/alarm
            - action: light.turn_on
              metadata: {}
              data: {}
              target:
                entity_id: light.ipad_browser_screen
            - action: media_player.play_media
              data:
                media:
                  media_content_id: media-source://media_source/local/slow-ding.mp3
                  media_content_type: audio/mpeg
                  metadata:
                    title: slow-ding.mp3
                    thumbnail:
                    media_class: music
                    children_media_class:
                    navigateIds:
                      - {}
                      - media_content_type: app
                        media_content_id: media-source://media_source
              target:
                entity_id: media_player.ipad_browser
            - delay:
                hours: 0
                minutes: 0
                seconds: 45
                milliseconds: 0
            - action: media_player.play_media
              data:
                media:
                  media_content_id: media-source://media_source/local/medium-ding.mp3
                  media_content_type: audio/mpeg
                  metadata:
                    title: medium-ding.mp3
                    thumbnail:
                    media_class: music
                    children_media_class:
                    navigateIds:
                      - {}
                      - media_content_type: app
                        media_content_id: media-source://media_source
              target:
                entity_id: media_player.ipad_browser
            - delay:
                hours: 0
                minutes: 0
                seconds: 10
                milliseconds: 0
            - action: media_player.play_media
              data:
                media:
                  media_content_id: media-source://media_source/local/fast-ding.mp3
                  media_content_type: audio/mpeg
                  metadata:
                    title: fast-ding.mp3
                    thumbnail:
                    media_class: music
                    children_media_class:
                    navigateIds:
                      - {}
                      - media_content_type: app
                        media_content_id: media-source://media_source
              target:
                entity_id: media_player.ipad_browser
            - delay:
                hours: 0
                minutes: 0
                seconds: 5
                milliseconds: 0
            - action: media_player.media_stop
              metadata: {}
              data: {}
              target:
                entity_id: media_player.ipad_browser
          alias: When Arming Away or Pending Away
        - conditions:
            - condition: trigger
              id:
                - alarm-pending
            - condition: state
              entity_id: alarm_control_panel.alarmo
              attribute: arm_mode
              state: armed_night
          sequence:
            - if:
                - condition: trigger
                  id:
                    - alarm-pending
              then:
                - action: script.notify_sarah_and_nathan
                  metadata: {}
                  data:
                    use_alexa: false
                    use_persistent_notification: false
                    notify_sarah: true
                    notify_nathan: true
                    text_nathan: false
                    text_sarah: false
                    text_garrett: false
                    text_ice_contacts: false
                    bypass_quiet_mode: false
                    use_siren: false
                    email_nathan: false
                    message: Alarm Pending
                    notification_actions:
                      - action: DISARM_ALARM_NOW
                        title: Disarm
                    more_info:
                      "Triggered by: {{state_attr('alarm_control_panel.alarmo',
                      'open_sensors')}}"
            - action: browser_mod.navigate
              metadata: {}
              data:
                path: /wall-panel/alarm
                browser_id:
                  - f3b01d256ece808e760a985d55adef21
              enabled: true
            - action: light.turn_on
              metadata: {}
              data: {}
              target:
                entity_id: light.ipad_browser_screen
            - action: media_player.play_media
              data:
                media:
                  media_content_id: media-source://media_source/local/slow-ding.mp3
                  media_content_type: audio/mpeg
                  metadata:
                    title: slow-ding.mp3
                    thumbnail:
                    media_class: music
                    children_media_class:
                    navigateIds:
                      - {}
                      - media_content_type: app
                        media_content_id: media-source://media_source
              target:
                entity_id: media_player.ipad_browser
              enabled: false
            - delay:
                hours: 0
                minutes: 0
                seconds: 45
                milliseconds: 0
              enabled: false
            - action: media_player.play_media
              data:
                media:
                  media_content_id: media-source://media_source/local/medium-ding.mp3
                  media_content_type: audio/mpeg
                  metadata:
                    title: medium-ding.mp3
                    thumbnail:
                    media_class: music
                    children_media_class:
                    navigateIds:
                      - {}
                      - media_content_type: app
                        media_content_id: media-source://media_source
              target:
                entity_id: media_player.ipad_browser
              enabled: true
            - delay:
                hours: 0
                minutes: 0
                seconds: 20
                milliseconds: 0
              enabled: true
            - action: media_player.play_media
              data:
                media:
                  media_content_id: media-source://media_source/local/fast-ding.mp3
                  media_content_type: audio/mpeg
                  metadata:
                    title: fast-ding.mp3
                    thumbnail:
                    media_class: music
                    children_media_class:
                    navigateIds:
                      - {}
                      - media_content_type: app
                        media_content_id: media-source://media_source
              target:
                entity_id: media_player.ipad_browser
              enabled: true
            - delay:
                hours: 0
                minutes: 0
                seconds: 10
                milliseconds: 0
              enabled: true
            - action: media_player.media_stop
              metadata: {}
              data: {}
              target:
                entity_id: media_player.ipad_browser
          alias: When Pending Night
        - conditions:
            - condition: trigger
              id:
                - alarm-triggered
          sequence:
            - action: media_player.media_stop
              metadata: {}
              data: {}
              target:
                entity_id: media_player.ipad_browser
            - action: script.notify_sarah_and_nathan
              metadata: {}
              data:
                use_alexa: false
                use_persistent_notification: false
                notify_sarah: false
                notify_nathan: true
                text_nathan: false
                text_sarah: false
                text_garrett: false
                text_ice_contacts: false
                bypass_quiet_mode: false
                use_siren: false
                email_nathan: false
                message: Alarm Triggered
                notification_actions:
                  - action: DISARM_ALARM_NOW
                    title: Disarm
            - choose:
                - conditions:
                    - condition: state
                      entity_id: alarm_control_panel.alarmo
                      attribute: arm_mode
                      state: armed_away
                  sequence:
                    - action: siren.turn_on
                      metadata: {}
                      data: {}
                      target:
                        entity_id: siren.esp_siren_esp_siren
                - conditions:
                    - condition: state
                      entity_id: alarm_control_panel.alarmo
                      attribute: arm_mode
                      state: armed_night
                  sequence: []
            - action: siren.turn_on
              metadata: {}
              data: {}
              target:
                entity_id:
                  - siren.side_door_siren
                  - siren.front_door_siren
            - if:
                - condition: state
                  entity_id: schedule.guard_mode_schedule
                  state: "on"
              then:
                - if:
                    - condition: state
                      entity_id: input_boolean.wake_me_up_for_guard_mode
                      state: "on"
                  then:
                    - data: {}
                      target:
                        entity_id: switch.nathans_fan
                      action: switch.turn_off
                    - data:
                        brightness_pct: 100
                      target:
                        entity_id: light.bedroom
                      action: light.turn_on
                    - data:
                        message: Intruder Alert
                        use_alexa: true
                        notify_sarah: true
                        notify_nathan: true
                        text_nathan: true
                        text_sarah: true
                        text_ice_contacts: false
                        bypass_quiet_mode: true
                        more_info: Motion detected at {{state_attr(trigger.entity_id, 'friendly_name')}}
                      action: script.notify_sarah_and_nathan
                - alias: Flash Porch Lights and Honk Horn
                  repeat:
                    count: "5"
                    sequence:
                      - data: {}
                        target:
                          entity_id:
                            - light.side_porch
                            - light.string_lights
                            - light.back_porch
                            - light.front_porch
                        action: light.turn_off
                      - delay:
                          hours: 0
                          minutes: 0
                          seconds: 1
                          milliseconds: 0
                      - data: {}
                        target:
                          entity_id:
                            - light.side_porch
                            - light.string_lights
                            - light.back_porch
                            - light.front_porch
                        action: light.turn_on
                      - delay:
                          hours: 0
                          minutes: 0
                          seconds: 1
                          milliseconds: 0
                      - if:
                          - condition: state
                            entity_id: device_tracker.tesleigh_lynn_location
                            state: home
                          - condition: state
                            entity_id: input_boolean.wake_me_up_for_guard_mode
                            state: "on"
                        then:
                          - continue_on_error: true
                            data: {}
                            action: button.press
                            target:
                              entity_id:
                                - button.tesleigh_lynn_honk_horn
                                - button.tesleigh_lynn_flash_lights_2
        - conditions:
            - condition: trigger
              id:
                - alarm-disarmed
          sequence:
            - action: media_player.media_stop
              metadata: {}
              data: {}
              target:
                entity_id: media_player.ipad_browser
            - action: siren.turn_off
              metadata: {}
              data: {}
              target:
                entity_id:
                  - siren.esp_siren_esp_siren
                  - siren.front_door_siren
                  - siren.side_door_siren
            - choose:
                - conditions:
                    - condition: state
                      entity_id: input_boolean.visitors
                      state: "on"
                    - condition: numeric_state
                      entity_id: sensor.omada_checker_mqtt_checkers_number_of_clients_on_guest_network
                      above: 0
                  sequence:
                    - action: browser_mod.navigate
                      metadata: {}
                      data:
                        path: /wall-panel/visitor
                        browser_id:
                          - f3b01d256ece808e760a985d55adef21
                - conditions:
                    - condition: state
                      entity_id: input_boolean.visitors
                      state: "on"
                    - condition: numeric_state
                      entity_id: sensor.omada_checker_mqtt_checkers_number_of_clients_on_guest_network
                      below: 1
                  sequence:
                    - action: browser_mod.navigate
                      metadata: {}
                      data:
                        path: /wall-panel/welcome
                        browser_id:
                          - f3b01d256ece808e760a985d55adef21
              default:
                - action: browser_mod.navigate
                  metadata: {}
                  data:
                    path: /wall-panel/home
                    browser_id:
                      - f3b01d256ece808e760a985d55adef21
        - conditions:
            - condition: trigger
              id:
                - disarm-from-notification
          sequence:
            - action: alarm_control_panel.alarm_disarm
              metadata: {}
              data:
                code: "{{states('input_text.home_alarm_code')}}"
              target:
                entity_id: alarm_control_panel.alarmo
        - conditions:
            - condition: trigger
              id:
                - trigger-from-notification
          sequence:
            - action: alarm_control_panel.alarm_trigger
              metadata: {}
              data:
                code: "{{states('input_text.home_alarm_code')}}"
              target:
                entity_id: alarm_control_panel.alarmo
        - conditions:
            - condition: trigger
              id:
                - night-alarm-schedule-on
            - condition: state
              entity_id: alarm_control_panel.alarmo
              state: disarmed
            - condition: state
              state: "on"
              entity_id: input_boolean.automatically_arm_at_night
          sequence:
            - action: alarm_control_panel.alarm_arm_night
              metadata: {}
              data: {}
              target:
                entity_id: alarm_control_panel.alarmo
        - conditions:
            - condition: trigger
              id:
                - night-alarm-schedule-off
                - guard-mode-off
            - condition: state
              entity_id: alarm_control_panel.alarmo
              state: armed_night
          sequence:
            - action: alarm_control_panel.alarm_disarm
              metadata: {}
              data:
                code: "{{states('input_text.home_alarm_code')}}"
              target:
                entity_id: alarm_control_panel.alarmo
        - conditions:
            - condition: trigger
              id:
                - guard-mode-on
            - condition: state
              entity_id: schedule.guard_mode_schedule
              state: "on"
            - condition: state
              entity_id: alarm_control_panel.alarmo
              state: disarmed
          sequence:
            - action: alarm_control_panel.alarm_arm_night
              metadata: {}
              data: {}
              target:
                entity_id: alarm_control_panel.alarmo
  mode: restart
- id: alexa_media_player_authentication_required
