- id: '1622937162847'
  alias: Basement Lights
  description: ''
  trigger:
  - platform: state
    entity_id: binary_sensor.basement_door
    to: 'on'
    id: door_open
  - platform: state
    entity_id: binary_sensor.basement_motion_sensor
    id: motion_on
    to: 'on'
    from: 'off'
  - platform: state
    entity_id: binary_sensor.basement_motion_sensor
    id: motion_off
    to: 'off'
    from: 'on'
    for:
      hours: 0
      minutes: 15
      seconds: 0
  condition: []
  action:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: door_open
      sequence:
      - service: light.turn_on
        data: {}
        target:
          entity_id:
          - light.laundry_room
          - light.basement_stairs
      - wait_for_trigger:
        - platform: state
          entity_id: binary_sensor.basement_door
          from: 'on'
          to: 'off'
          for:
            hours: 0
            minutes: 0
            seconds: 30
        timeout: 00:10:00
        continue_on_timeout: true
      - service: light.turn_off
        target:
          area_id: basement
        data:
          transition: 14
    - conditions:
      - condition: trigger
        id: motion_off
      sequence:
      - service: light.turn_off
        target:
          area_id: basement
        data:
          transition: 30
    - conditions:
      - condition: trigger
        id: motion_on
      sequence:
      - service: light.turn_on
        target:
          entity_id:
          - light.basement_stairs
          - light.basement_lights
        data: {}
    default: []
  mode: restart
