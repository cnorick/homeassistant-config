- id: '1681131407908'
  alias: Octoprint
  description: ''
  triggers:
  - value_template: '{{now() >= states(''sensor.octoprint_estimated_finish_time'')
      | as_datetime - timedelta(minutes=5)}}'
    id: 5-min-warning
    trigger: template
  - entity_id:
    - binary_sensor.octoprint_printing
    to: 'off'
    from: 'on'
    id: done-printing
    trigger: state
  - entity_id:
    - binary_sensor.octoprint_printing
    to: 'on'
    id: print-started
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 5-min-warning
      sequence:
      - data:
          use_alexa: false
          notify_sarah: false
          notify_nathan: true
          text_nathan: false
          text_sarah: false
          text_ice_contacts: false
          bypass_quiet_mode: false
          message: Your 3D print is nearly finished
          more_info: 5 minutes remaining. Click to view
          url: http://octoprint.servers.home/cr6-se/?#temp
        action: script.notify_sarah_and_nathan
    - conditions:
      - condition: trigger
        id: done-printing
      sequence:
      - data:
          filename: /config/www/snapshots/octoprint.jpg
        target:
          entity_id:
          - camera.octoprint_camera_2
        action: camera.snapshot
      - data:
          use_alexa: true
          notify_sarah: false
          notify_nathan: true
          text_nathan: false
          text_sarah: false
          text_ice_contacts: false
          bypass_quiet_mode: false
          message: 3D Printer Done
          url: http://octoprint.servers.home/cr6-se/?#temp
          image: /local/snapshots/octoprint.jpg
          image_type: jpeg
        action: script.notify_sarah_and_nathan
    - conditions:
      - condition: trigger
        id: print-started
      sequence:
      - data:
          filename: /config/www/snapshots/octoprint.jpg
        target:
          entity_id:
          - camera.octoprint_camera_2
        action: camera.snapshot
      - wait_for_trigger:
        - trigger: state
          entity_id:
          - automation.octoprint
          from: unknown
        timeout:
          hours: 0
          minutes: 10
          seconds: 0
          milliseconds: 0
      - data:
          use_alexa: false
          notify_sarah: false
          notify_nathan: true
          text_nathan: false
          text_sarah: false
          text_ice_contacts: false
          bypass_quiet_mode: false
