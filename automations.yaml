- id: "1627506438431"
  alias: Turn on Lights When Doors are Opened
  description: ""
  trigger:
    - platform: state
      entity_id: binary_sensor.bedroom_door
      to: "on"
      id: bedroom_door
    - platform: state
      entity_id: binary_sensor.office_door
      id: office_door
      to: "on"
    - platform: state
      entity_id:
        - binary_sensor.nursery_door_opening
      id: guest_bedroom_door
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.couch_sleepers
      state: "off"
    - condition: numeric_state
      entity_id: sensor.living_room_presence_light_sensor_light_level
      below: "5"
  action:
    - variables:
        dining_room_on: "{{is_state('light.dining_room', 'on')}}"
        hallway_on: "{{is_state('light.hallway', 'on')}}"
    - if:
        - condition: template
          value_template: "{{not dining_room_on}}"
      then:
        - service: light.turn_on
          target:
            area_id: dining_room
          data:
            transition: 5
            brightness_pct: 40
    - choose:
        - conditions:
            - condition: or
              conditions:
                - condition: trigger
                  id: office_door
                - condition: trigger
                  id: guest_bedroom_door
            - condition: template
              value_template: "{{not hallway_on}}"
          sequence:
            - service: light.turn_on
              target:
                area_id: hallway
              data: {}
              enabled: false
      default: []
    - delay:
        hours: 0
        minutes: 3
        seconds: 0
        milliseconds: 0
    - if:
        - condition: template
          value_template: "{{not dining_room_on}}"
      then:
        - service: light.turn_off
          target:
            area_id: dining_room
          data:
            transition: 9
    - if:
        - condition: template
          value_template: "{{not hallway_on}}"
      then:
        - service: light.turn_off
          target:
            area_id: hallway
          data: {}
  mode: parallel
  max: 2
