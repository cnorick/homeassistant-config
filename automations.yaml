              | round(2)}}'
            notify_sarah: true
            notify_nathan: true
            use_alexa: false
            text_nathan: false
            text_sarah: false
            text_ice_contacts: false
            bypass_quiet_mode: false
            use_persistent_notification: true
            persistent_notification_id: charging-stats
          action: script.notify_sarah_and_nathan
        - action: script.notify_sarah_and_nathan
          metadata: {}
          data:
            use_alexa: false
            use_persistent_notification: true
            notify_sarah: false
            notify_nathan: true
            text_nathan: false
            text_sarah: false
            text_garrett: true
            text_ice_contacts: false
            bypass_quiet_mode: false
            message: Tianna Charging for Last Month
            more_info: 'Total Cost Last Month: ${{((state_attr("sensor.tiana_utility_meter",
