          seconds: 10
          milliseconds: 0
      - wait_template: '{{is_state(''binary_sensor.living_room_presence_presence_sensor_8'',
          ''on'') and (as_timestamp(now()))-(as_timestamp(states.binary_sensor.living_room_presence_presence_sensor_2.last_changed))
          < 5 }}'
        continue_on_timeout: true
        timeout: '300'
      - service: light.turn_off
