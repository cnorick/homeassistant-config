- id: "1720301534873"
  alias: Power Outage
  description: ""
  triggers:
    - entity_id:
        - binary_sensor.power_outage_checker_locust_online_status_3
      to: unavailable
      id: power-out-locust
      trigger: state
    - entity_id:
        - binary_sensor.power_outage_checker_mqtt_checkers_online_status
      to: unavailable
      id: power-out-walnut
      trigger: state
    - entity_id:
        - binary_sensor.power_outage_checker_locust_online_status_3
      id: power-on-locust
      from: unavailable
      to: "on"
      trigger: state
    - entity_id:
        - binary_sensor.power_outage_checker_mqtt_checkers_online_status
      id: power-on-walnut
      from: unavailable
      to: "on"
      trigger: state
    - trigger: homeassistant
      event: start
      id: ha-up
    - trigger: homeassistant
      event: shutdown
      id: ha-dowm
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id:
                - power-out-locust
                - power-out-walnut
            - condition: state
              entity_id: binary_sensor.power_outage_checker_locust_online_status_3
              state: unavailable
            - condition: state
              entity_id: binary_sensor.power_outage_checker_mqtt_checkers_online_status
              state: unavailable
          sequence:
            - metadata: {}
              data:
                use_alexa: false
                use_persistent_notification: true
                notify_sarah: true
                notify_nathan: true
                text_nathan: true
                text_sarah: true
                text_ice_contacts: false
                bypass_quiet_mode: false
                message: Power Out
                more_info: The power went out at {{ now() | as_local }}
              action: script.notify_sarah_and_nathan
        - conditions:
            - condition: trigger
              id:
                - power-on-walnut
            - condition: state
              entity_id: binary_sensor.power_outage_checker_locust_online_status_3
              state: unavailable
          sequence:
            - metadata: {}
              data:
                use_alexa: false
                use_persistent_notification: true
                notify_sarah: true
                notify_nathan: true
                text_nathan: true
                text_sarah: true
                text_ice_contacts: false
                bypass_quiet_mode: false
                message: Power Back On
                more_info: The power came back on at {{ now() | as_local }}
              action: script.notify_sarah_and_nathan
        - conditions:
            - condition: trigger
              id:
                - power-on-locust
            - condition: state
              entity_id: binary_sensor.power_outage_checker_mqtt_checkers_online_status
              state: unavailable
          sequence:
            - metadata: {}
              data:
                use_alexa: false
                use_persistent_notification: true
                notify_sarah: true
                notify_nathan: true
                text_nathan: true
                text_sarah: true
                text_ice_contacts: false
                bypass_quiet_mode: false
                message: Power Back On
                more_info: The power came back on at {{ now() | as_local }}
              action: script.notify_sarah_and_nathan
        - conditions:
            - condition: trigger
