  alias: First Person Home
  description: ''
  triggers:
  - entity_id: binary_sensor.occupied
    from: 'off'
    to: 'on'
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: sun
        after: sunset
        after_offset: -01:00:00
      sequence:
      - target:
          entity_id: '{{ lights }}'
        action: light.turn_on
        data: {}
      - action: light.turn_on
        metadata: {}
        target:
          entity_id: light.h616c_745e
        data:
          effect: '{{states(''input_select.porch_light_scenes'')}}'
