  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - power-out-locust
        - power-out-walnut
      - condition: state
        entity_id: binary_sensor.power_outage_checker_locust_online_status_3
        state: unavailable
      - condition: state
        entity_id: binary_sensor.power_outage_checker_mqtt_checkers_online_status
        state: unavailable
