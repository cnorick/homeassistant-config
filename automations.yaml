            url: /lovelace/tesla
            more_info: 'Cost at Home so far this Month: ${{states(''sensor.tesla_home_monthly_charging_cost'')}}

              Cost at Rusty and Donna''s Last Week: ${{states(''sensor.last_week_s_charging_cost_at_rusty_and_donna_s'')}}

              Click for more'
