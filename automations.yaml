- id: '1694468089195'
  alias: Bedroom Presence
  description: ''
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.bedroom_presence_presence_sensor_9
    to: 'on'
    id: sarah-standing
    enabled: true
  - platform: state
    entity_id:
    - binary_sensor.bedroom_presence_presence_sensor_11
    to: 'on'
    id: nathan-standing
  - platform: state
    entity_id:
    - binary_sensor.bedroom_presence_presence_sensor_1
    to: 'off'
    for:
      hours: 0
      minutes: 15
      seconds: 0
    id: bedroom-clear-5-min
  - platform: state
    entity_id:
    - binary_sensor.bedroom_presence_presence_sensor_4
    to: 'on'
    id: bathroom-door
  - platform: state
    entity_id:
    - input_boolean.night_mode
    to: 'off'
    id: morning-start
  condition: []
  action:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - sarah-standing
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.bedroom_presence_presence_sensor_9
          state: 'on'
        - condition: template
          value_template: '{{(as_timestamp(now()))-(as_timestamp(states.binary_sensor.bedroom_presence_presence_sensor_9.last_changed))
            < 3 }}'
        enabled: false
      - condition: state
        entity_id: input_boolean.night_mode
        state: 'on'
      - condition: state
        entity_id: light.sarah_s_nightstand
        state: 'off'
      alias: Sarah Gets Up at Night
      sequence:
      - data:
          brightness: 7
        target:
          entity_id: light.sarah_s_nightstand
        action: light.turn_on
      - wait_for_trigger:
        - platform: state
          entity_id:
          - binary_sensor.bedroom_presence_presence_sensor_9
          to: 'off'
          for:
            hours: 0
            minutes: 0
            seconds: 30
        timeout:
          hours: 0
          minutes: 10
          seconds: 0
          milliseconds: 0
      - condition: numeric_state
        entity_id: light.sarah_s_nightstand
        attribute: brightness
        below: 26
      - data: {}
        target:
          entity_id: light.sarah_s_nightstand
        action: light.turn_off
    - conditions:
      - condition: trigger
        id:
        - nathan-standing
      - condition: state
        entity_id: input_boolean.night_mode
        state: 'on'
      - condition: state
        entity_id: light.nathan_s_nightstand
        state: 'off'
      alias: Nathan Gets Up at Night
      sequence:
      - data:
          brightness: 8
        target:
          entity_id: light.nathan_s_nightstand
        action: light.turn_on
      - wait_for_trigger:
        - platform: state
          entity_id:
          - binary_sensor.bedroom_presence_presence_sensor_11
          for:
            hours: 0
            minutes: 0
            seconds: 30
        timeout:
          hours: 0
          minutes: 10
          seconds: 0
          milliseconds: 0
      - condition: numeric_state
        entity_id: light.nathan_s_nightstand
        attribute: brightness
        below: 26
      - data: {}
        target:
          entity_id: light.nathan_s_nightstand
        action: light.turn_off
    - conditions:
      - condition: trigger
        id:
        - bedroom-clear-5-min
      - condition: state
        entity_id: input_boolean.turn_off_bedroom_when_not_occupied
        state: 'on'
      - condition: time
        before: '21:00:00'
      alias: Turn Off Bedroom When no Presence
      sequence:
      - if:
        - condition: state
          entity_id: binary_sensor.bathroom_door
          state: 'off'
        then:
        - wait_for_trigger:
          - platform: state
            entity_id:
            - binary_sensor.bathroom_door
            to: 'on'
          timeout:
            hours: 0
            minutes: 10
            seconds: 0
            milliseconds: 0
        - if:
          - condition: state
            entity_id: binary_sensor.bathroom_door
            state: 'on'
          then:
          - stop: Came out of the bathroom. Leave lights on
      - data:
          transition: 7
        target:
          area_id: b2672f722c53428e92427703040fb764
        action: light.turn_off
    - conditions:
      - condition: trigger
        id:
        - bathroom-door
      - condition: state
        entity_id: light.bathroom
        state: 'off'
      sequence:
      - target:
          entity_id: scene.bathroom_night
        metadata: {}
        action: scene.turn_on
      - wait_for_trigger:
        - platform: state
          entity_id:
          - binary_sensor.apollo_msr_2_f8ee88_radar_target
          to: 'on'
        - platform: state
          entity_id:
          - binary_sensor.bedroom_presence_presence_sensor_4
          to: 'off'
          id: walk-away
          for:
            hours: 0
            minutes: 0
            seconds: 5
        timeout:
          hours: 0
          minutes: 0
          seconds: 20
          milliseconds: 0
      - if:
        - condition: state
          entity_id: binary_sensor.apollo_msr_2_f8ee88_radar_target
          state: 'on'
        then:
        - stop: Done. Bathroom Lights will stay on
        else:
        - data: {}
          target:
            entity_id: light.bathroom
          action: light.turn_off
    - conditions:
      - condition: trigger
        id:
        - morning-start
      - condition: state
        entity_id: input_boolean.visitors
        state: 'off'
      sequence:
      - wait_for_trigger:
        - platform: state
          entity_id:
          - binary_sensor.bedroom_presence_presence_sensor_9
          - binary_sensor.bedroom_presence_presence_sensor_11
          to: 'on'
        continue_on_timeout: false
      - data: {}
        action: vacuum.return_to_base
        target:
          entity_id: vacuum.roborock_s8_max_ultra
  mode: parallel
  max: 10
- id: '1696595424459'
  alias: Living Room Presence
  description: ''
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.living_room_presence_presence_sensor_2
    to: 'on'
    id: couch-standing
  condition: []
  action:
  - choose:
    - conditions:
