- id: '1670001478544'
  alias: Christmas Present Hunt
  description: ''
  triggers:
  - entity_id:
    - input_boolean.christmas_hunt_enable
    from: 'off'
    to: 'on'
    id: hunt-enabled
    trigger: state
  - entity_id:
    - input_select.christmas_current_step
    to: '1'
    id: clue-1-started
    trigger: state
  - entity_id:
    - input_select.christmas_room_selector
    to: Main Bathroom
    id: clue-1-done
    trigger: state
  - entity_id:
    - input_select.christmas_current_step
    to: '2'
    id: clue-2-started
    trigger: state
  - value_template: '{{states(''binary_sensor.back_door_input'') == ''off'' and

      states(''binary_sensor.island_input'') == ''on'' and

      states(''binary_sensor.back_porch_input'') == ''on'' and

      states(''binary_sensor.kitchen_overhead_input'') == ''on'' and

      states(''binary_sensor.kitchen_counter_input'') == ''on''}}'
    id: clue-2-done
    trigger: template
  - entity_id:
    - input_select.christmas_current_step
    to: '3'
    id: clue-3-started
    trigger: state
  - entity_id:
    - input_select.christmas_current_step
    to: '4'
    id: clue-4-started
    trigger: state
  - event_type: jingle-bells
    id: clue-4-done
    trigger: event
  - entity_id:
    - input_select.christmas_current_step
    to: '5'
    id: clue-5-started
    trigger: state
  - entity_id:
    - input_button.christmas_clue_5_solved
    id: clue-5-done
    trigger: state
  - entity_id:
    - input_select.christmas_current_step
    to: '6'
    id: clue-6-started
    trigger: state
  - value_template: '{{states(''input_button.christmas_complete_current_clue'') |
      as_timestamp  > now() | as_timestamp - 1  and states(''input_select.christmas_current_step'')
      == ''1''}}'
    id: clue-1-done
    trigger: template
  - value_template: '{{states(''input_button.christmas_complete_current_clue'') |
      as_timestamp  > now() | as_timestamp - 1  and states(''input_select.christmas_current_step'')
      == ''2''}}'
    id: clue-2-done
    trigger: template
  - value_template: '{{states(''input_button.christmas_complete_current_clue'') |
      as_timestamp  > now() | as_timestamp - 1  and states(''input_select.christmas_current_step'')
      == ''3''}}'
    id: clue-3-done
    trigger: template
  - value_template: '{{states(''input_button.christmas_complete_current_clue'') |
      as_timestamp  > now() | as_timestamp - 1  and states(''input_select.christmas_current_step'')
      == ''4''}}'
    id: clue-4-done
    trigger: template
  - value_template: '{{states(''input_button.christmas_complete_current_clue'') |
      as_timestamp  > now() | as_timestamp - 1  and states(''input_select.christmas_current_step'')
      == ''5''}}'
    id: clue-5-done
    trigger: template
  - value_template: '{{states(''input_button.christmas_complete_current_clue'') |
      as_timestamp  > now() | as_timestamp - 1 and states(''input_select.christmas_current_step'')
      == ''6''}}'
    id: clue-6-done
    trigger: template
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.christmas_hunt_enable
      state: 'on'
    - condition: trigger
      id: start-button-pressed
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start-button-pressed
        alias: Start Button Pressed
      sequence:
      - data: {}
        target:
          entity_id: input_boolean.christmas_hunt_enable
        action: input_boolean.turn_on
    - conditions:
      - condition: trigger
        id: hunt-enabled
        alias: Hunt Started
      sequence:
      - data:
          option: '0'
        target:
          entity_id: input_select.christmas_current_step
        action: input_select.select_option
      - parallel:
        - choose:
          default:
          - data:
              volume_level: 0.6
            target:
              entity_id: media_player.everywhere
            action: media_player.volume_set
          alias: Set Volume everywhere
        - choose:
          default:
          - data: {}
            target:
              entity_id: light.home
            action: light.turn_off
          - data: {}
            target:
              entity_id: switch.sarah_s_fan_socket_1
            action: switch.turn_off
          alias: Turn off lights
        alias: Set volume and turn off lights
      - data:
          volume_level: 0.9
        target:
          entity_id: media_player.living_room_echo
        action: media_player.volume_set
      - parallel:
        - choose:
          default:
          - data:
              media:
                media_content_id: christmas_05
                media_content_type: sound
                metadata: {}
            target:
              entity_id:
              - media_player.living_room_echo
            action: media_player.play_media
          - data:
              data:
                type: tts
              message: Merry Christmas! You've got some really nice presents waiting
                for you this year, but they won't come free. I have a bunch of puzzles
                for you to solve first. It'll probably take you a while, so I'll put
                on some Christmas music while you work.
            action: notify.alexa_media_living_room_echo
          alias: Explain the game
        - choose:
          default:
          - data:
              source: Everywhere
            target:
              entity_id: media_player.spotify_nathan_orick
            action: media_player.select_source
          - delay:
              hours: 0
              minutes: 0
              seconds: 20
              milliseconds: 0
            alias: Wait for source to change and wait for announcement to finish
          - data:
              media:
                media_content_id: https://open.spotify.com/playlist/37i9dQZF1DX6R7QUWePReA?si=e5dda850a8ef4d64
                media_content_type: playlist
                metadata: {}
            target:
              entity_id: media_player.spotify_nathan_orick
            action: media_player.play_media
          alias: Turn on Music
        - choose: []
          alias: Handle Lights
          default:
          - delay:
              hours: 0
              minutes: 0
              seconds: 5
              milliseconds: 0
          - data: {}
            target:
              entity_id: switch.sarah_s_fan_socket_1
            action: switch.turn_on
          - delay:
              hours: 0
              minutes: 0
              seconds: 20
              milliseconds: 0
          - data: {}
            target:
              entity_id: scene.living_space_under_the_tree
            action: scene.turn_on
        alias: Intro, start music, and turn on lights
      - if:
        - condition: not
          conditions:
          - condition: state
            entity_id: media_player.spotify_nathan_orick
            state: playing
            for:
              hours: 0
              minutes: 0
              seconds: 3
        then:
        - wait_for_trigger:
          - entity_id:
            - media_player.spotify_nathan_orick
            to: playing
            for:
              hours: 0
              minutes: 0
              seconds: 3
            trigger: state
          timeout:
            hours: 0
            minutes: 0
            seconds: 10
            milliseconds: 0
        alias: Wait for music
      - data:
          data:
            type: tts
          message: Ok, now that we have some tunes, let me give you your first clue
        alias: Working on First Clue Announcement
        action: notify.alexa_media_living_room_echo
      - delay:
          hours: 0
          minutes: 0
          seconds: 10
          milliseconds: 0
      - data:
          option: '1'
        target:
          entity_id: input_select.christmas_current_step
        action: input_select.select_option
      - data:
          option: None Selected
        target:
          entity_id: input_select.christmas_room_selector
        action: input_select.select_option
      - data:
          message: Click For the First Clue
          notify_nathan: true
          notify_sarah: true
          use_alexa: false
          url: /lovelace/christmas-hunt
        alias: Send First Clue Notification
        action: script.notify_sarah_and_nathan
      - data:
          data:
            type: tts
          message: Ok, I just sent you a notification. Check your phone for the first
            clue... Good luck!
        alias: Check your phone announcement
        action: notify.alexa_media_living_room_echo
      - data:
          volume_level: 0.6
        target:
          entity_id: media_player.living_room_echo
        action: media_player.volume_set
    - conditions:
      - condition: trigger
        id: clue-1-started
      sequence:
      - data: {}
        target:
          area_id: living_space
        action: light.turn_off
      - data: {}
        target:
          entity_id: automation.turn_on_bathroom_when_motion_detected_2
        action: automation.turn_off
      - repeat:
          while:
          - condition: state
            entity_id: input_select.christmas_current_step
            state: '1'
          sequence:
          - data:
              action: true
              entity_1:
                entity_id: light.bath_1
              entity_2:
                entity_id: light.bath_2
              entity_3:
                entity_id: light.bath_3
              entity_4:
                entity_id: light.bath_4
              entity_5:
                entity_id: light.bath_5
              entity_6:
                entity_id: light.bath_6
              entity_7:
                entity_id: light.bath_ceiling
              delay: 250
            action: script.tier_toggle_devices
          - data:
              action: false
              entity_1:
                entity_id: light.bath_1
              entity_2:
                entity_id: light.bath_2
              entity_3:
                entity_id: light.bath_3
              entity_4:
                entity_id: light.bath_4
              entity_5:
                entity_id: light.bath_5
              entity_6:
                entity_id: light.bath_6
              entity_7:
                entity_id: light.bath_ceiling
              delay: 250
            action: script.tier_toggle_devices
        alias: Blink Bathroom Lights Until Clue 1 is Done
    - conditions:
      - condition: trigger
        id: clue-1-done
