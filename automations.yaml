      to: Main Bathroom
      id: clue-1-done
    - platform: state
      entity_id:
        - input_select.christmas_current_step
      to: "2"
      id: clue-2-started
    - platform: template
      value_template: "{{states('binary_sensor.back_door_input') == 'off' and

        states('binary_sensor.island_input') == 'on' and

        states('binary_sensor.back_porch_input') == 'on' and

        states('binary_sensor.kitchen_overhead_input') == 'on' and

        states('binary_sensor.kitchen_counter_input') == 'on'}}"
      id: clue-2-done
    - platform: state
      entity_id:
        - input_select.christmas_current_step
      to: "3"
      id: clue-3-started
    - device_id: e09b0160fe46cbe2aadf009d127c9f91
      domain: zha
      platform: device
      type: remote_button_short_press
      subtype: turn_on
      id: clue-3-done
    - platform: state
      entity_id:
        - input_select.christmas_current_step
      to: "4"
      id: clue-4-started
    - platform: event
      event_type: jingle-bells
      id: clue-4-done
    - platform: state
      entity_id:
        - input_select.christmas_current_step
      to: "5"
      id: clue-5-started
    - platform: state
      entity_id:
        - input_button.christmas_clue_5_solved
      id: clue-5-done
    - platform: state
      entity_id:
        - input_select.christmas_current_step
      to: "6"
      id: clue-6-started
    - platform: template
      value_template:
        "{{states('input_button.christmas_complete_current_clue') |
        as_timestamp  > now() | as_timestamp - 1  and states('input_select.christmas_current_step')
        == '1'}}"
      id: clue-1-done
    - platform: template
      value_template:
        "{{states('input_button.christmas_complete_current_clue') |
        as_timestamp  > now() | as_timestamp - 1  and states('input_select.christmas_current_step')
        == '2'}}"
      id: clue-2-done
    - platform: template
      value_template:
        "{{states('input_button.christmas_complete_current_clue') |
        as_timestamp  > now() | as_timestamp - 1  and states('input_select.christmas_current_step')
        == '3'}}"
      id: clue-3-done
    - platform: template
      value_template:
        "{{states('input_button.christmas_complete_current_clue') |
        as_timestamp  > now() | as_timestamp - 1  and states('input_select.christmas_current_step')
        == '4'}}"
      id: clue-4-done
    - platform: template
      value_template:
        "{{states('input_button.christmas_complete_current_clue') |
        as_timestamp  > now() | as_timestamp - 1  and states('input_select.christmas_current_step')
        == '5'}}"
      id: clue-5-done
    - platform: template
      value_template:
        "{{states('input_button.christmas_complete_current_clue') |
        as_timestamp  > now() | as_timestamp - 1 and states('input_select.christmas_current_step')
        == '6'}}"
      id: clue-6-done
  condition:
    - condition: or
      conditions:
        - condition: state
          entity_id: input_boolean.christmas_hunt_enable
          state: "on"
        - condition: trigger
          id: start-button-pressed
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: start-button-pressed
              alias: Start Button Pressed
          sequence:
            - service: input_boolean.turn_on
              data: {}
              target:
                entity_id: input_boolean.christmas_hunt_enable
        - conditions:
            - condition: trigger
              id: hunt-enabled
              alias: Hunt Started
          sequence:
            - service: input_select.select_option
              data:
                option: "0"
              target:
                entity_id: input_select.christmas_current_step
            - parallel:
                - choose:
                  default:
                    - service: media_player.volume_set
                      data:
                        volume_level: 0.6
                      target:
                        entity_id: media_player.everywhere
                  alias: Set Volume everywhere
                - choose:
                  default:
                    - service: light.turn_off
                      data: {}
                      target:
                        entity_id: light.home
                    - service: switch.turn_off
                      data: {}
                      target:
                        entity_id: switch.sarah_s_fan_socket_1
                  alias: Turn off lights
              alias: Set volume and turn off lights
            - service: media_player.volume_set
              data:
                volume_level: 0.9
              target:
                entity_id: media_player.living_room_echo
            - parallel:
                - choose:
                  default:
                    - service: media_player.play_media
                      data:
                        media_content_type: sound
                        media_content_id: christmas_05
                      target:
                        entity_id:
                          - media_player.living_room_echo
                    - service: notify.alexa_media_living_room_echo
                      data:
                        data:
                          type: tts
                        message:
                          Merry Christmas! You've got some really nice presents waiting
                          for you this year, but they won't come free. I have a bunch of puzzles
                          for you to solve first. It'll probably take you a while, so I'll put
                          on some Christmas music while you work.
                  alias: Explain the game
                - choose:
                  default:
                    - service: media_player.select_source
