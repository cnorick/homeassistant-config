- id: "1721912607838"
  alias: Vacation Mode
  description: ""
  triggers:
    - entity_id:
        - input_boolean.vacation_mode
      to: "on"
      from: "off"
      id: vacation-mode-on
      trigger: state
    - entity_id:
        - input_boolean.vacation_mode
      to: "off"
      from: "on"
      id: vacation-mode-off
      trigger: state
    - entity_id:
        - sensor.home_nathan_distance
        - sensor.home_sarah_distance
      below: 262000
      id: headed_home
      trigger: numeric_state
    - entity_id:
        - sensor.home_nathan_distance
        - sensor.home_sarah_distance
      id: leaving_home
      above: 262000
      trigger: numeric_state
    - trigger: state
      entity_id:
        - input_button.alexa_vacation
      id: alexa-vacaction
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id:
                - vacation-mode-off
          sequence:
            - data: {}
              target:
                entity_id: input_boolean.keep_ac_in_eco
              action: input_boolean.turn_off
            - data:
                preset_mode: none
              target:
                entity_id: climate.kitchen
              action: climate.set_preset_mode
        - conditions:
            - condition: trigger
              id:
                - vacation-mode-on
          sequence:
            - data: {}
              target:
                entity_id: input_boolean.keep_ac_in_eco
              action: input_boolean.turn_on
            - data:
                preset_mode: eco
              target:
                entity_id: climate.kitchen
              action: climate.set_preset_mode
              enabled: false
            - if:
                - condition: state
                  entity_id: input_boolean.enable_vacuum
                  state: ""
              then:
                - action: button.press
                  metadata: {}
                  data: {}
                  target:
                    entity_id: button.rich_strike_full_clean
        - conditions:
            - condition: trigger
              id:
                - headed_home
            - condition: state
              entity_id: input_boolean.vacation_mode
              state: "on"
          sequence:
            - data:
                message: AC Turned On
                more_info:
                  Home Assistant has observed someone is headed home and has turned
                  on the AC and turned off vacation mode. If this is not expected, click
                  this notification to turn it off.
                url: /lovelace/climate
                notify_nathan: true
                notify_sarah: true
                text_nathan: false
                text_sarah: false
                text_ice_contacts: false
                bypass_quiet_mode: false
              action: script.notify_sarah_and_nathan
            - metadata: {}
              data: {}
              target:
                entity_id: input_boolean.vacation_mode
              action: input_boolean.turn_off
        - conditions:
            - condition: trigger
              id:
                - leaving_home
            - condition: numeric_state
              entity_id: sensor.home_sarah_distance
              above: 262000
            - condition: numeric_state
              entity_id: sensor.home_nathan_distance
              above: 262000
            - condition: state
              entity_id: input_boolean.vacation_mode
              state: "off"
          sequence:
            - data:
                message: AC Turned Off
                more_info:
                  Home Assistant has observed everyone is leaving home and has
                  turned off the AC and turned on vacation mode. If this is not expected,
                  click this notification to turn it back on.
                url: /lovelace/climate
                notify_nathan: true
                notify_sarah: true
                text_nathan: false
                text_sarah: false
                text_ice_contacts: false
                bypass_quiet_mode: false
              action: script.notify_sarah_and_nathan
            - metadata: {}
              data: {}
              target:
                entity_id: input_boolean.vacation_mode
              action: input_boolean.turn_on
        - conditions:
            - condition: trigger
              id:
                - alexa-vacaction
          sequence:
            - action: input_boolean.turn_on
              metadata: {}
              data: {}
              target:
                entity_id: input_boolean.vacation_mode
      default: []
  mode: parallel
  max: 10
