- id: '1643585268012'
  alias: Bathroom Fan
  description: Toggle Fan Based on Humidity and Motion
  triggers:
  - entity_id: sensor.bathroom_humidity
    above: input_number.bathroom_humidity_threshold
    id: too_humid
    trigger: numeric_state
  - entity_id: switch.bathroom_fan
    id: run_for_small_time
    to: 'on'
    for:
      hours: 0
      minutes: 15
      seconds: 0
    trigger: state
  - entity_id: switch.bathroom_fan
    id: run_for_long_time
    to: 'on'
    for:
      hours: 0
      minutes: 45
      seconds: 0
    trigger: state
  - entity_id: sensor.bathroom_humidity
    id: humidity_lowered
    below: input_number.bathroom_humidity_threshold
    for:
      hours: 0
      minutes: 5
      seconds: 0
    trigger: numeric_state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: too_humid
      sequence:
      - target:
          entity_id: switch.bathroom_fan
        data: {}
        action: switch.turn_on
    - conditions:
      - condition: trigger
        id: run_for_small_time
      - condition: numeric_state
        entity_id: sensor.bathroom_humidity
        below: input_number.bathroom_humidity_threshold
      - condition: state
        entity_id: binary_sensor.apollo_msr_2_f8ee88_radar_target
        state: 'off'
        for:
          hours: 0
          minutes: 5
          seconds: 0
      sequence:
      - target:
          entity_id: switch.bathroom_fan
        data: {}
        action: switch.turn_off
    - conditions:
      - condition: trigger
        id: run_for_long_time
      sequence:
      - target:
          entity_id: switch.bathroom_fan
        data: {}
        action: switch.turn_off
    - conditions:
      - condition: trigger
        id: humidity_lowered
      - condition: state
        entity_id: binary_sensor.apollo_msr_2_f8ee88_radar_target
        state: 'off'
        for:
          hours: 0
          minutes: 3
          seconds: 0
      - condition: state
        entity_id: binary_sensor.bathroom_door
        state: 'on'
      sequence:
      - target:
          entity_id: switch.bathroom_fan
        data: {}
        action: switch.turn_off
    default: []
  mode: restart
- id: '1645303901832'
  alias: Grow Room
  description: ''
  trigger:
  - platform: sun
    event: sunrise
    id: sunrise
  - platform: template
    value_template: '{% set hours = states(''input_number.hours_of_plant_light'')|float
      %}

      {% set turn_off_time = (state_attr(''sun.sun'', ''next_rising'') | as_datetime
      - timedelta(days = 1) + timedelta(hours = hours))%}

      {{ now() > turn_off_time }}'
    id: time_expired
  - platform: time
    at: '17:30:00'
    id: at-end-of-day
  condition: []
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: sunrise
      sequence:
      - service: switch.turn_on
        data: {}
        target:
          entity_id: switch.grow_light
      - delay:
          hours: 0
          minutes: 1
          seconds: 0
          milliseconds: 0
      - service: camera.snapshot
        data:
          filename: /config/www/grow_room/{{now() | as_timestamp | timestamp_custom('%Y-%m-%d')}}.jpg
        target:
          entity_id: camera.grow_room_camera
      - service: script.notify_sarah_and_nathan
        data:
          use_alexa: false
          notify_sarah: true
          notify_nathan: true
          text_nathan: false
          text_sarah: false
          text_ice_contacts: false
          bypass_quiet_mode: false
          message: Plants!
          url: /lovelace/greenhouse
          image_type: jpeg
          image: /local/grow_room/{{now() | as_timestamp |     timestamp_custom('%Y-%m-%d')}}.jpg
    - conditions:
      - condition: trigger
        id: time_expired
      sequence:
      - service: switch.turn_off
        data: {}
        target:
          entity_id: switch.grow_light
    - conditions:
      - condition: trigger
        id: at-end-of-day
      - condition: template
        value_template: '{{ (states.binary_sensor.wyze_motion4.last_changed | as_local).date()
          != now().date() }}'
      sequence:
      - service: script.notify_sarah_and_nathan
        data:
          use_alexa: false
          notify_sarah: true
          notify_nathan: true
          text_nathan: false
          text_sarah: false
          text_ice_contacts: false
          bypass_quiet_mode: false
          message: The Plants are Thirsty
          more_info: You haven't watered the plants today
          url: /lovelace/greenhouse
          image: /local/grow_room/{{now() | as_timestamp |         timestamp_custom('%Y-%m-%d')}}.jpg
          image_type: jpeg
    default: []
  mode: single
