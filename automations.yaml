- id: "1753926909304"
  alias: Meshtastic
  description: ""
  triggers:
    - trigger: event
      event_type: meshtastic_api_text_message
      enabled: true
      id: dm-to-tree
      event_data:
        data:
          to:
            node: 819691296
            channel:
          gateway: 819691296
    - trigger: event
      event_type: meshtastic_api_text_message
      enabled: true
      id: all-messages
      event_data: {}
    - trigger: event
      event_type: meshtastic_api_text_message
      enabled: true
      id: pine-private
      event_data:
        data:
          to:
            node:
            channel: 1
          gateway: 819691296
    - trigger: state
      entity_id:
        - sensor.meshtastic_tree_3589061009_node_last_heard
      id: buffalo-online
  conditions: []
  actions:
    - alias: Send notification on message
      if:
        - condition: trigger
          id:
            - all-messages
      then:
        - action: script.notify_sarah_and_nathan
          metadata: {}
          data:
            use_alexa: false
            use_persistent_notification: false
            notify_sarah: false
            notify_nathan: true
            text_nathan: false
            text_sarah: false
            text_garrett: false
            text_ice_contacts: false
            bypass_quiet_mode: false
            use_siren: false
            email_nathan: false
            message:
              "Meshtastic: \n{%- if trigger.event.data.data.from is defined and
              trigger.event.data.data.from == 3677053688 %} TATR\n{%- else %} {{trigger.event.data.data.from}}\n{%-
              endif %}\nto\n{%- if trigger.event.data.data.to is defined and trigger.event.data.data.to.node
              == 819691296 %} TREE\n{%- elif trigger.event.data.data.to is defined and
              trigger.event.data.data.to.channel == 0 %} LongFast\n{%- elif trigger.event.data.data.to
              is defined and trigger.event.data.data.to.channel == 1 %} PinePrivate\n{%-
              elif trigger.event.data.data.to is defined and trigger.event.data.data.to.channel
              is defined %} Channel {{ trigger.event.data.data.to.channel }}\n{%- elif
              trigger.event.data.data.to is defined and trigger.event.data.data.to.node
              is defined %} Node {{ trigger.event.data.data.to.node }}\n{%- else %} {{trigger.event.data.data.to}}\n{%-
              endif -%}"
            more_info: "{{trigger.event.data.data.message}}"
            url: /config/devices/device/a640809c2f8e03d5bc278ff250c62bc3
            mobile_message_group: meshtastic
    - if:
        - condition: trigger
          id:
            - dm-to-tree
      then:
        - delay:
            seconds: 5
        - action: meshtastic.send_text
          data:
            ack: true
            from: "{{ trigger.event.data.data.gateway }}"
            to: "{{ trigger.event.data.data.from }}"
            text:
              "Hi! This node is an infrastructure node near downtown JC. Please message
              TATR (node #3677053688)."
      alias: Respond to DMs
    - alias: Pine Private Alert
      if:
        - condition: trigger
          id:
            - pine-private
        - condition: template
          value_template: "{{trigger.event.data.data.message | trim | first == \"\U0001F514\"}}"
      then:
        - action: script.notify_sarah_and_nathan
          metadata: {}
          data:
            use_alexa: true
            use_persistent_notification: true
            notify_sarah: true
            notify_nathan: false
            text_nathan: true
            text_sarah: false
            text_garrett: true
            text_ice_contacts: false
            bypass_quiet_mode: false
            use_siren: false
            email_nathan: false
            message: "\U0001F514 Meshtastic Alert \U0001F514"
            more_info: "{{trigger.event.data.data.message}}"
            url: /config/devices/device/a640809c2f8e03d5bc278ff250c62bc3
    - alias: Pine Private Weather
      if:
        - condition: trigger
          id:
            - pine-private
        - condition: template
          value_template: '{{trigger.event.data.data.message | trim | lower == "wx"}}'
      then:
        - action: weather.get_forecasts
          metadata: {}
          data:
            type: daily
          response_variable: forecast_data
          target:
            entity_id: weather.home
        - action: script.notify_sarah_and_nathan
          metadata: {}
          data:
            use_alexa: false
            use_persistent_notification: false
            notify_sarah: false
            notify_nathan: false
            text_nathan: false
            text_sarah: false
            text_garrett: false
            text_ice_contacts: false
            bypass_quiet_mode: false
            use_siren: false
            email_nathan: false
            message:
              "{% set daily_forecast = forecast_data['weather.home'].forecast[0]
              %} Today's forecast: {{ daily_forecast.condition | capitalize }} with a
              high of {{ daily_forecast.temperature }}°F and a low of {{ daily_forecast.templow
              }}°F. Wind: {{ daily_forecast.wind_speed }} mph from {{ daily_forecast.wind_bearing
              }}. Precipitation chance: {{ daily_forecast.precipitation }}%. {% if daily_forecast.detailed_description
              is defined %}   {{ daily_forecast.detailed_description }} {% endif %}"
            notify_pine_private: true
    - alias: "Buffalo Online "
      if:
        - condition: trigger
          id:
            - buffalo-online
      then:
        - action: script.notify_sarah_and_nathan
          metadata: {}
          data:
            use_alexa: false
            use_persistent_notification: false
            notify_sarah: false
            notify_nathan: true
            text_nathan: false
            text_sarah: false
            text_garrett: false
            text_ice_contacts: false
            bypass_quiet_mode: false
            use_siren: false
            email_nathan: false
            notify_pine_private: false
            message: "\U0001F9AC Buffalo Mountain Online"
  mode: queued
  max: 10
