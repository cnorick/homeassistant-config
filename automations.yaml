- id: '1609559449831'
  alias: Morning Routine
  description: ''
  triggers:
  - to: 'off'
    entity_id: input_boolean.night_mode
    from: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: binary_sensor.occupied
    state: 'on'
  actions:
  - wait_for_trigger:
    - entity_id:
      - binary_sensor.bedroom_presence_presence_sensor_11
      to: 'on'
      from: 'off'
      trigger: state
    timeout: 03:00:00
    continue_on_timeout: false
  - parallel:
    - action: script.display_morning_dashboard
      metadata: {}
      data:
        remote_input: remote.bedroom_chromecast
        chromecast_input: media_player.bedroom_chromecast_cast
        dasboard_path_input: lovelace
        view_path_input: Morning
      continue_on_error: true
    enabled: false
  - wait_for_trigger:
    - entity_id:
      - binary_sensor.bedroom_presence_presence_sensor_4
      to: 'on'
      trigger: state
    continue_on_timeout: false
    timeout:
      hours: 0
      minutes: 30
      seconds: 0
      milliseconds: 0
  - data:
      volume_level: 0.8
    target:
      entity_id:
      - media_player.bathroom_echo
      - media_player.kitchen_echo_show
    action: media_player.volume_set
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: not
          conditions:
          - condition: state
            entity_id: binary_sensor.pixel_10_pro_is_charging
            state:
            - 'on'
        - condition: state
          entity_id: binary_sensor.pixel_10_pro_device_locked
          state:
          - 'on'
      sequence:
      - data:
          entity_id: media_player.bathroom_echo
          media:
            media_content_id: amzn1.ask.skill.8e0fbda3-b70c-481d-878f-a2e5e17158c9
            media_content_type: skill
            metadata: {}
        enabled: true
        action: media_player.play_media
    default:
    - data:
        entity_id: media_player.bathroom_echo
        media:
          media_content_id: amzn1.ask.skill.8e0fbda3-b70c-481d-878f-a2e5e17158c9
          media_content_type: skill
          metadata: {}
      action: media_player.play_media
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: weather.home
        attribute: temperature
        below: '55'
      - condition: not
        conditions:
        - condition: state
          entity_id: climate.kitchen
          state: cool
      sequence:
      - target:
          area_id: b2672f722c53428e92427703040fb764
        data: {}
        action: climate.turn_on
      - target:
          area_id: b2672f722c53428e92427703040fb764
        data:
          temperature: '{{states(''input_number.fireplace_temperature_when_showering'')}}'
        action: climate.set_temperature
    default: []
  - wait_for_trigger:
    - entity_id: binary_sensor.bedroom_door
      to: 'on'
      from: 'off'
      trigger: state
    timeout:
      hours: 2
      minutes: 0
      seconds: 0
      milliseconds: 0
    continue_on_timeout: false
  - type: turn_on
    device_id: 4727b2015d290faf287bd1a335620fab
    entity_id: light.kitchen_counter
    domain: light
  - type: turn_on
    device_id: a634fea07a944853cfa4fe710f25fd04
    entity_id: light.kitchen_overhead
    domain: light
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: not
          conditions:
          - condition: state
            entity_id: binary_sensor.pixel_10_pro_is_charging
            state:
            - 'on'
        - condition: state
          state:
          - 'on'
          entity_id: binary_sensor.pixel_10_pro_device_locked
      sequence:
      - data:
          media:
            media_content_id: amzn1.ask.skill.8e0fbda3-b70c-481d-878f-a2e5e17158c9
            media_content_type: skill
            metadata: {}
        target:
          entity_id:
          - media_player.kitchen_echo_show
        action: media_player.play_media
      - data: {}
        target:
          entity_id: script.heat_coffee_water
        enabled: false
        action: script.turn_on
  - target:
      entity_id: media_player.bathroom_echo
    data: {}
    action: media_player.media_stop
  - wait_for_trigger:
    - entity_id: binary_sensor.living_room_presence_presence_sensor_9
      from: 'off'
      to: 'on'
      id: in_livingroom
      trigger: state
    timeout: 02:00:00
    continue_on_timeout: false
  - choose:
    - conditions:
      - condition: template
        value_template: '{{wait.trigger.id == "in_livingroom"}}'
      sequence:
      - target:
          entity_id: light.living_room_lamp
        data:
          transition: 6
          brightness: 255
        action: light.turn_on
      - target:
          entity_id: media_player.kitchen_echo_show
        data: {}
        action: media_player.media_stop
      - wait_for_trigger:
        - value_template: "{{\n    is_state('binary_sensor.office_door', 'off')\n
            \   and is_state('binary_sensor.public_space_motion', 'off')\n}}"
          trigger: template
        timeout: 02:00:00
        continue_on_timeout: false
      - target:
          entity_id: light.living_room_lamp
        data:
          transition: 20
        action: light.turn_off
    default: []
  - condition: state
    entity_id: person.sarah
    state: not_home
  - data: {}
    entity_id: light.bedroom
    action: light.turn_off
  mode: single
- id: '1619291764637'
  alias: Motion -- Side Door
  description: ''
  use_blueprint:
    path: networkingcat/yet_another_motion_automation.yaml
    input:
      time_scene_night: 00:00:00
      motion_entity: binary_sensor.side_door_person
      light_target:
        entity_id:
        - light.side_porch
        - light.laundry_room
      elevation_check: 10
      time_scene_evening: 00:00:00
      time_scene_day: 0:00:00
      time_scene_morning: 0:00:00
      automation_blocker: input_boolean.people_outside
      time_scene_ambient_end: 0:00:00
      automation_blocker_boolean: false
      no_motion_wait: 300
- id: '1620332636293'
  alias: Low battery level detection & notification for all battery sensors
  description: ''
  use_blueprint:
    path: sbyx/low-battery-level-detection-notification-for-all-battery-sensors.yaml
    input:
      exclude:
        entity_id:
        - sensor.iphone_2_battery_state
        - sensor.iphone_2_battery_level
        - sensor.nathan_s_pixel_battery_level
        - sensor.pixel_battery_state
        - sensor.rooben_battery_level
        - sensor.google_pixel_watch_battery_level
        - sensor.deep_freezer_temperature_sensor_battery
        - sensor.freezer_temperature_battery
        - sensor.meshtastic_tree_3677053688_device_battery_level
      actions:
      - data:
          message: Battery is Dying
          url: /lovelace/data
          use_alexa: false
          notify_nathan: true
          notify_sarah: false
          text_nathan: false
          text_sarah: false
          text_ice_contacts: false
          bypass_quiet_mode: false
          use_persistent_notification: true
          persistent_notification_id: dying_battery
          more_info: The battery is dying for {{ sensors }}
        action: script.notify_sarah_and_nathan
- id: '1620357325146'
  alias: Motion -- Back Yard
  description: ''
  use_blueprint:
    path: networkingcat/yet_another_motion_automation.yaml
    input:
      time_scene_night: 0:00:00
      motion_entity: binary_sensor.back_porch_motion
      elevation_check: 10
      time_scene_evening: 0:00:00
      time_scene_day: 0:00:00
      time_scene_morning: 0:00:00
      time_scene_ambient_end: 0:00:00
      time_scene_ambient_start: 0:00:00
      automation_blocker: input_boolean.people_outside
      light_target:
        entity_id: light.back_porch
      automation_blocker_boolean: false
      no_motion_wait: 300
- id: '1620360426386'
  alias: Home Alarm
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - alarm_control_panel.alarmo
    to: pending
    id: alarm-pending
  - trigger: state
    entity_id:
    - alarm_control_panel.alarmo
    to: arming
    id: alarm-arming
  - trigger: state
    entity_id:
    - alarm_control_panel.alarmo
    to: disarmed
    id: alarm-disarmed
  - trigger: state
    entity_id:
    - alarm_control_panel.alarmo
    to: triggered
    id: alarm-triggered
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: DISARM_ALARM_NOW
    id: disarm-from-notification
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: TRIGGER_ALARM_NOW
    id: trigger-from-notification
  - trigger: state
    entity_id:
    - schedule.guard_mode_schedule
    to: 'on'
    id: night-alarm-schedule-on
  - trigger: state
    entity_id:
    - schedule.guard_mode_schedule
    to: 'off'
    id: night-alarm-schedule-off
  - trigger: state
    entity_id:
    - input_boolean.automatically_arm_at_night
    from: 'off'
    to: 'on'
    id: guard-mode-on
  - trigger: state
    entity_id:
    - input_boolean.automatically_arm_at_night
    from: 'on'
    to: 'off'
    id: guard-mode-off
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - public-space-motion
        - back-door-open
      - condition: state
        entity_id: alarm_control_panel.home_alarm
        state: armed_away
      sequence:
      - target:
          entity_id: alarm_control_panel.home_alarm
        action: alarm_control_panel.alarm_trigger
        data: {}
    - conditions:
      - condition: trigger
        id:
        - alarm-arming
        - alarm-pending
      - condition: state
        entity_id: alarm_control_panel.alarmo
        attribute: arm_mode
        state: armed_away
      sequence:
      - if:
        - condition: trigger
          id:
          - alarm-pending
        then:
        - action: script.notify_sarah_and_nathan
          metadata: {}
          data:
            use_alexa: false
            use_persistent_notification: false
            notify_sarah: true
            notify_nathan: true
            text_nathan: false
            text_sarah: false
            text_garrett: false
            text_ice_contacts: false
            bypass_quiet_mode: false
            use_siren: false
            email_nathan: false
            message: Alarm Pending
            notification_actions:
            - action: DISARM_ALARM_NOW
              title: Disarm
            more_info: 'Triggered by: {{state_attr(''alarm_control_panel.alarmo'',
              ''open_sensors'')}}'
        - action: notify.alexa_media_kitchen_echo_show
          metadata: {}
          data:
            message: Alarm Activated
      - action: browser_mod.navigate
        metadata: {}
        data:
          path: /wall-panel/alarm
          user_id:
          - person.wall_panel
      - action: light.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: light.ipad_browser_screen
      - action: media_player.play_media
        data:
          media:
            media_content_id: media-source://media_source/local/slow-ding.mp3
            media_content_type: audio/mpeg
            metadata:
              title: slow-ding.mp3
              thumbnail:
              media_class: music
              children_media_class:
              navigateIds:
              - {}
              - media_content_type: app
                media_content_id: media-source://media_source
        target:
          entity_id: media_player.ipad_browser
      - delay:
          hours: 0
          minutes: 0
          seconds: 45
          milliseconds: 0
      - action: media_player.play_media
        data:
          media:
            media_content_id: media-source://media_source/local/medium-ding.mp3
            media_content_type: audio/mpeg
            metadata:
              title: medium-ding.mp3
              thumbnail:
              media_class: music
              children_media_class:
              navigateIds:
              - {}
              - media_content_type: app
                media_content_id: media-source://media_source
        target:
          entity_id: media_player.ipad_browser
      - delay:
          hours: 0
          minutes: 0
          seconds: 10
          milliseconds: 0
      - action: media_player.play_media
        data:
          media:
            media_content_id: media-source://media_source/local/fast-ding.mp3
            media_content_type: audio/mpeg
            metadata:
              title: fast-ding.mp3
              thumbnail:
              media_class: music
              children_media_class:
              navigateIds:
              - {}
              - media_content_type: app
                media_content_id: media-source://media_source
        target:
          entity_id: media_player.ipad_browser
      - delay:
          hours: 0
          minutes: 0
          seconds: 5
          milliseconds: 0
      - action: media_player.media_stop
        metadata: {}
        data: {}
        target:
          entity_id: media_player.ipad_browser
      alias: When Arming Away or Pending Away
    - conditions:
      - condition: trigger
        id:
        - alarm-pending
      - condition: state
        entity_id: alarm_control_panel.alarmo
        attribute: arm_mode
        state: armed_night
      sequence:
      - if:
        - condition: trigger
          id:
          - alarm-pending
        then:
        - action: script.notify_sarah_and_nathan
          metadata: {}
          data:
            use_alexa: false
            use_persistent_notification: false
            notify_sarah: true
            notify_nathan: true
            text_nathan: false
            text_sarah: false
            text_garrett: false
            text_ice_contacts: false
            bypass_quiet_mode: false
            use_siren: false
            email_nathan: false
            message: Alarm Pending
            notification_actions:
            - action: DISARM_ALARM_NOW
              title: Disarm
            more_info: 'Triggered by: {{state_attr(''alarm_control_panel.alarmo'',
              ''open_sensors'')}}'
      - action: browser_mod.navigate
        metadata: {}
        data:
          path: /wall-panel/alarm
          user_id:
          - person.wall_panel
        enabled: true
      - action: light.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: light.ipad_browser_screen
      - action: media_player.play_media
        data:
          media:
            media_content_id: media-source://media_source/local/slow-ding.mp3
            media_content_type: audio/mpeg
            metadata:
              title: slow-ding.mp3
              thumbnail:
              media_class: music
              children_media_class:
              navigateIds:
              - {}
              - media_content_type: app
                media_content_id: media-source://media_source
        target:
          entity_id: media_player.ipad_browser
        enabled: false
      - delay:
          hours: 0
          minutes: 0
          seconds: 45
          milliseconds: 0
        enabled: false
      - action: media_player.play_media
        data:
          media:
            media_content_id: media-source://media_source/local/medium-ding.mp3
            media_content_type: audio/mpeg
            metadata:
              title: medium-ding.mp3
              thumbnail:
              media_class: music
              children_media_class:
              navigateIds:
              - {}
              - media_content_type: app
                media_content_id: media-source://media_source
        target:
          entity_id: media_player.ipad_browser
        enabled: true
      - delay:
          hours: 0
          minutes: 0
          seconds: 20
          milliseconds: 0
        enabled: true
      - action: media_player.play_media
        data:
          media:
            media_content_id: media-source://media_source/local/fast-ding.mp3
            media_content_type: audio/mpeg
            metadata:
              title: fast-ding.mp3
              thumbnail:
              media_class: music
              children_media_class:
              navigateIds:
              - {}
              - media_content_type: app
                media_content_id: media-source://media_source
        target:
          entity_id: media_player.ipad_browser
        enabled: true
      - delay:
          hours: 0
          minutes: 0
          seconds: 10
          milliseconds: 0
        enabled: true
      - action: media_player.media_stop
        metadata: {}
        data: {}
        target:
          entity_id: media_player.ipad_browser
      alias: When Pending Night
    - conditions:
      - condition: trigger
        id:
        - alarm-triggered
      sequence:
      - action: media_player.media_stop
        metadata: {}
        data: {}
        target:
          entity_id: media_player.ipad_browser
      - action: script.notify_sarah_and_nathan
        metadata: {}
        data:
          use_alexa: false
          use_persistent_notification: false
          notify_sarah: false
          notify_nathan: true
          text_nathan: false
          text_sarah: false
          text_garrett: false
          text_ice_contacts: false
          bypass_quiet_mode: false
          use_siren: false
          email_nathan: false
          message: Alarm Triggered
          notification_actions:
          - action: DISARM_ALARM_NOW
            title: Disarm
      - choose:
        - conditions:
          - condition: state
            entity_id: alarm_control_panel.alarmo
            attribute: arm_mode
            state:
            - armed_away
            - null
          sequence:
          - action: siren.turn_on
            metadata: {}
            data: {}
            target:
              entity_id: siren.esp_siren_esp_siren
        - conditions:
          - condition: state
            entity_id: alarm_control_panel.alarmo
            attribute: arm_mode
            state: armed_night
          sequence: []
      - action: siren.turn_on
        metadata: {}
        data: {}
        target:
          entity_id:
          - siren.side_door_siren
          - siren.front_door_siren
      - if:
        - condition: state
          entity_id: schedule.guard_mode_schedule
          state: 'on'
        then:
        - if:
          - condition: state
            entity_id: input_boolean.wake_me_up_for_guard_mode
            state: 'on'
          then:
          - data: {}
            target:
              entity_id: switch.nathans_fan
            action: switch.turn_off
          - data:
              brightness_pct: 100
            target:
              entity_id: light.bedroom
            action: light.turn_on
          - data:
              message: Intruder Alert
              use_alexa: true
              notify_sarah: true
              notify_nathan: true
              text_nathan: true
              text_sarah: true
              text_ice_contacts: false
              bypass_quiet_mode: true
              more_info: Motion detected at {{state_attr(trigger.entity_id, 'friendly_name')}}
            action: script.notify_sarah_and_nathan
        - alias: Flash Porch Lights and Honk Horn
          repeat:
            count: '5'
            sequence:
            - data: {}
              target:
                entity_id:
                - light.side_porch
                - light.string_lights
                - light.back_porch
                - light.front_porch
              action: light.turn_off
            - delay:
                hours: 0
                minutes: 0
                seconds: 1
                milliseconds: 0
            - data: {}
              target:
                entity_id:
                - light.side_porch
                - light.string_lights
                - light.back_porch
                - light.front_porch
              action: light.turn_on
            - delay:
                hours: 0
                minutes: 0
                seconds: 1
                milliseconds: 0
            - if:
              - condition: state
                entity_id: device_tracker.tesleigh_lynn_location
                state: home
              - condition: state
                entity_id: input_boolean.wake_me_up_for_guard_mode
                state: 'on'
              then:
              - continue_on_error: true
                data: {}
                action: button.press
                target:
                  entity_id:
                  - button.tesleigh_lynn_honk_horn
                  - button.tesleigh_lynn_flash_lights_2
    - conditions:
      - condition: trigger
        id:
        - alarm-disarmed
      sequence:
      - action: media_player.media_stop
        metadata: {}
        data: {}
        target:
          entity_id: media_player.ipad_browser
      - action: siren.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - siren.esp_siren_esp_siren
          - siren.front_door_siren
          - siren.side_door_siren
      - choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.visitors
            state: 'on'
          - condition: numeric_state
            entity_id: sensor.omada_checker_mqtt_checkers_number_of_clients_on_guest_network
            above: 0
          sequence:
          - action: browser_mod.navigate
            metadata: {}
            data:
              path: /wall-panel/visitor
              user_id:
              - person.wall_panel
        - conditions:
          - condition: state
            entity_id: input_boolean.visitors
            state: 'on'
          - condition: numeric_state
            entity_id: sensor.omada_checker_mqtt_checkers_number_of_clients_on_guest_network
            below: 1
          sequence:
          - action: browser_mod.navigate
            metadata: {}
            data:
              path: /wall-panel/welcome
              user_id:
              - person.wall_panel
        default:
        - action: browser_mod.navigate
          metadata: {}
          data:
            path: /wall-panel/home
            user_id:
            - person.wall_panel
    - conditions:
      - condition: trigger
        id:
        - disarm-from-notification
      sequence:
      - action: alarm_control_panel.alarm_disarm
        metadata: {}
        data:
          code: '{{states(''input_text.home_alarm_code'')}}'
        target:
          entity_id: alarm_control_panel.alarmo
    - conditions:
      - condition: trigger
        id:
        - trigger-from-notification
      sequence:
      - action: alarm_control_panel.alarm_trigger
        metadata: {}
        data:
          code: '{{states(''input_text.home_alarm_code'')}}'
        target:
          entity_id: alarm_control_panel.alarmo
    - conditions:
      - condition: trigger
        id:
        - night-alarm-schedule-on
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: disarmed
      - condition: state
        state: 'on'
        entity_id: input_boolean.automatically_arm_at_night
      sequence:
      - action: alarm_control_panel.alarm_arm_night
        metadata: {}
        data: {}
        target:
          entity_id: alarm_control_panel.alarmo
    - conditions:
      - condition: trigger
        id:
        - night-alarm-schedule-off
        - guard-mode-off
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: armed_night
      sequence:
      - action: alarm_control_panel.alarm_disarm
        metadata: {}
        data:
          code: '{{states(''input_text.home_alarm_code'')}}'
        target:
          entity_id: alarm_control_panel.alarmo
    - conditions:
      - condition: trigger
        id:
        - guard-mode-on
      - condition: state
        entity_id: schedule.guard_mode_schedule
        state: 'on'
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: disarmed
      sequence:
      - action: alarm_control_panel.alarm_arm_night
        metadata: {}
        data: {}
        target:
          entity_id: alarm_control_panel.alarmo
  mode: restart
- id: alexa_media_player_authentication_required
  alias: Alexa Media Player Authentication Required
  trigger:
  - platform: event
    event_type: alexa_media_relogin_required
  condition: []
  action:
  - action: script.notify_sarah_and_nathan
    data:
      use_alexa: false
      use_persistent_notification: true
      notify_sarah: false
      notify_nathan: true
      text_nathan: false
      text_sarah: false
      text_ice_contacts: false
      bypass_quiet_mode: false
      message: Alexa Re-authentication Required
- id: '1621301311010'
  alias: Motion -- Front Door
  description: ''
  use_blueprint:
    path: networkingcat/yet_another_motion_automation.yaml
    input:
      time_scene_night: 00:00:00
      motion_entity: binary_sensor.front_door_person
      time_scene_evening: 00:00:00
      time_scene_day: 0:00:00
      light_target:
        entity_id:
