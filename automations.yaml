- id: '1671113410657'
  alias: Smoke Alarm
  description: ''
  triggers:
  - entity_id:
    - switch.smoke_alarm
    to: 'on'
    id: alarm-on
    trigger: state
  - entity_id:
    - switch.smoke_alarm
    to: 'off'
    from: 'on'
    id: alarm-off
    for:
      hours: 0
      minutes: 0
      seconds: 30
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: alarm-on
      sequence:
      - data:
          message: Smoke Alarm Detected
          use_alexa: true
          notify_sarah: true
          notify_nathan: true
          text_nathan: true
          text_sarah: true
          text_ice_contacts: true
          bypass_quiet_mode: true
        action: script.notify_sarah_and_nathan
      - action: script.ring_keypad_actions
        metadata: {}
        data:
          mode: Smoke
        continue_on_error: true
    - conditions:
      - condition: trigger
        id: alarm-off
      sequence:
      - data:
          message: Smoke Alarm Has Stopped
          use_alexa: false
          notify_sarah: true
          notify_nathan: true
          text_nathan: true
          text_sarah: true
          text_ice_contacts: true
          bypass_quiet_mode: true
        action: script.notify_sarah_and_nathan
      - action: script.ring_keypad_actions
        metadata: {}
        data:
          mode: Disarm
        continue_on_error: true
  mode: single
- id: '1673822055354'
  alias: Handle Guest Login
  description: ''
  triggers:
  - event_type: ha_auto_login_guest_logged_in
    id: ha-auto-login
    trigger: event
  - entity_id:
    - sensor.omada_checker_mqtt_checkers_number_of_clients_on_guest_network
    for:
      hours: 0
      minutes: 0
      seconds: 30
    above: 0
    id: omada-guest-on-network
    trigger: numeric_state
  - entity_id:
    - sensor.omada_checker_mqtt_checkers_number_of_clients_on_guest_network
    for:
      hours: 0
      minutes: 0
      seconds: 0
    id: omada-no-guests-on-network
    below: 1
    trigger: numeric_state
  - event_type: mobile_app_notification_action
    event_data:
      action: ENABLE-GUEST-MODE
    id: enable-guest-mode-action
    trigger: event
  - event_type: mobile_app_notification_action
    event_data:
      action: DISABLE-GUEST-MODE
    id: disable-guest-mode-action
    trigger: event
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - ha-auto-login
      sequence:
      - data:
          message: Guest Logged In
          more_info: 'ip address: {{trigger.event.data.ip}}'
          notify_nathan: true
          notification_actions:
          - action: DISABLE-GUEST-MODE
            title: Disable Visitor Mode
        action: script.notify_sarah_and_nathan
      - action: browser_mod.navigate
        metadata: {}
        data:
          user_id:
          - person.wall_panel
          path: /wall-panel/visitor
      - if:
        - condition: state
          entity_id: input_boolean.babysitter_mode
          state: 'off'
        then:
        - data: {}
          target:
            entity_id: input_boolean.visitors
          action: input_boolean.turn_on
      - action: input_button.press
        metadata: {}
        data: {}
        target:
          entity_id: input_button.welcome_page_loaded
    - conditions:
      - condition: trigger
        id:
        - omada-guest-on-network
      sequence:
      - metadata: {}
        data:
          use_alexa: false
          use_persistent_notification: false
          notify_sarah: true
          notify_nathan: true
          text_nathan: false
          text_sarah: false
          text_ice_contacts: false
          bypass_quiet_mode: false
          message: Guest on Network
          notification_actions:
          - action: ENABLE-GUEST-MODE
            title: Enable Visitor Mode
        action: script.notify_sarah_and_nathan
    - conditions:
      - condition: trigger
        id:
        - omada-no-guests-on-network
      - condition: template
        value_template: '{{ trigger.from_state.state != "unavailable" and trigger.from_state.state
          != "unknown" }}'
      sequence:
      - metadata: {}
        data:
          use_alexa: false
          use_persistent_notification: false
          notify_sarah: true
          notify_nathan: true
          text_nathan: false
          text_sarah: false
          text_ice_contacts: false
          bypass_quiet_mode: false
          message: Guests Gone
          notification_actions:
          - action: DISABLE-GUEST-MODE
            title: Disable Visitor Mode
          more_info: Guests have been off the network for a while
        action: script.notify_sarah_and_nathan
    - conditions:
      - condition: trigger
        id:
        - enable-guest-mode-action
      sequence:
      - metadata: {}
        data: {}
        target:
          entity_id: input_boolean.visitors
        action: input_boolean.turn_on
    - conditions:
      - condition: trigger
        id:
        - disable-guest-mode-action
      sequence:
      - target:
          entity_id:
          - input_boolean.visitors
        data: {}
        action: input_boolean.turn_off
  mode: single
