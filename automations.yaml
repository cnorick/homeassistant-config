    to: unavailable
    id: power-out-walnut
    trigger: state
  - entity_id:
    - binary_sensor.power_outage_checker_locust_online_status_3
    id: power-on-locust
    from: unavailable
    to: 'on'
    trigger: state
  - entity_id:
