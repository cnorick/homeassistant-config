- id: nws_alert_automation
  alias: NWS Announce Weather Alert
  triggers:
  - entity_id:
    - sensor.nws_alerts_alerts
    trigger: state
  conditions:
  - condition: numeric_state
    entity_id: sensor.nws_alerts_alerts
    above: 0
  actions:
  - repeat:
      sequence:
      - variables:
          alert: '{{ repeat.item }}'
      - choose:
        - conditions:
          - alias: Thunderstorm
            condition: template
            value_template: '{{ (''Severe Thunderstorm Warning'' in alert.Event) and
              (alert.Type == ''Alert'') }}'
          sequence:
          - data:
              use_alexa: true
              notify_sarah: true
