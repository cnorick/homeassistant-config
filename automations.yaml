- id: '1779826116151'
  alias: 'HVAC: Output Performance Monitor'
  description: Monitors delta T between intake and vent after a configurable delay
    when AC or Heat turns on.
  triggers:
  - entity_id:
    - climate.kitchen
    to:
    - cooling
    - heating
    id: hvac_started
    trigger: state
  conditions: []
  actions:
  - delay: '{{ states(''input_number.hvac_setup_delay'') | int(15) * 60 }}'
  - condition: template
    value_template: '{{ is_state_attr(''climate.kitchen'', ''hvac_action'', trigger.to_state.attributes.hvac_action)
      }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.attributes.hvac_action == ''cooling''
          }}'
      - condition: template
        value_template: '{% set intake = states(''sensor.ac_intake_sensor_temperature'')
          | float(0) %} {% set vent = states(''sensor.ac_output_sensor_temperature'')
          | float(0) %} {% set target = states(''input_number.hvac_target_ac_differential'')
          | float(12) %} {{ (intake - vent) < target }}'
      sequence:
      - action: script.notify_sarah_and_nathan
        data:
          message: 'HVAC Alert: Poor AC Performance'
          more_info: 'The AC has been running for {{ states(''input_number.hvac_setup_delay'')
            | int }} minutes,  but the temperature split is only {{ (states(''sensor.ac_intake_sensor_temperature'')
            | float(0) - states(''sensor.ac_output_sensor_temperature'') | float(0))
            | round(1) }}°F  (Intake: {{ states(''sensor.ac_intake_sensor_temperature'')
            }}°F, Vent: {{ states(''sensor.ac_output_sensor_temperature'') }}°F).
            Target is {{ states(''input_number.hvac_target_ac_differential'') }}°F.'
          notify_nathan: true
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.attributes.hvac_action == ''heating''
          }}'
      - condition: template
        value_template: '{% set intake = states(''sensor.ac_intake_sensor_temperature'')
          | float(0) %} {% set vent = states(''sensor.ac_output_sensor_temperature'')
          | float(0) %} {% set target = states(''input_number.hvac_target_heat_differential'')
          | float(15) %} {{ (vent - intake) < target }}'
      sequence:
      - action: script.notify_sarah_and_nathan
        data:
          message: 'HVAC Alert: Poor Heating Performance'
          more_info: 'The Heat has been running for {{ states(''input_number.hvac_setup_delay'')
            | int }} minutes,  but the temperature split is only {{ (states(''sensor.ac_output_sensor_temperature'')
            | float(0) - states(''sensor.hvac_intake_temp'') | float(0)) | round(1)
            }}°F  (Intake: {{ states(''sensor.ac_intake_sensor_temperature'') }}°F,
            Vent: {{ states(''sensor.ac_output_sensor_temperature'') }}°F). Target
            is {{ states(''input_number.hvac_target_heat_differential'') }}°F.'
          notify_nathan: true
  mode: restart
