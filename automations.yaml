- id: "1609559449831"
  alias: Morning Routine
  description: ""
  triggers:
    - to: "off"
      entity_id: input_boolean.night_mode
      from: "on"
      trigger: state
  conditions:
    - condition: state
      entity_id: binary_sensor.occupied
      state: "on"
  actions:
    - wait_for_trigger:
        - entity_id:
            - binary_sensor.bedroom_presence_presence_sensor_11
          to: "on"
          from: "off"
          trigger: state
      timeout: 03:00:00
      continue_on_timeout: false
    - parallel:
        - action: script.display_morning_dashboard
          metadata: {}
          data:
            remote_input: remote.bedroom_chromecast
            chromecast_input: media_player.bedroom_chromecast_cast
            dasboard_path_input: lovelace
            view_path_input: Morning
          continue_on_error: true
      enabled: false
    - wait_for_trigger:
        - entity_id:
            - binary_sensor.bedroom_presence_presence_sensor_4
          to: "on"
          trigger: state
      continue_on_timeout: false
      timeout:
        hours: 0
        minutes: 30
        seconds: 0
        milliseconds: 0
    - data:
        volume_level: 0.8
      target:
        entity_id:
          - media_player.bathroom_echo
          - media_player.kitchen_echo_show
      action: media_player.volume_set
    - choose:
        - conditions:
            - condition: and
              conditions:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: binary_sensor.pixel_is_charging
                      state: "on"
                - condition: state
                  entity_id: binary_sensor.pixel_device_locked
                  state: "on"
          sequence:
            - data:
                entity_id: media_player.bathroom_echo
                media_content_id: amzn1.ask.skill.8e0fbda3-b70c-481d-878f-a2e5e17158c9
                media_content_type: skill
              enabled: true
              action: media_player.play_media
      default:
        - data:
            entity_id: media_player.bathroom_echo
            media_content_id: amzn1.ask.skill.8e0fbda3-b70c-481d-878f-a2e5e17158c9
            media_content_type: skill
          action: media_player.play_media
    - choose:
        - conditions:
            - condition: numeric_state
              entity_id: weather.home
              attribute: temperature
              below: "55"
            - condition: not
              conditions:
                - condition: state
                  entity_id: climate.kitchen
                  state: cool
          sequence:
            - target:
                area_id: b2672f722c53428e92427703040fb764
              data: {}
              action: climate.turn_on
            - target:
                area_id: b2672f722c53428e92427703040fb764
              data:
                temperature: "{{states('input_number.fireplace_temperature_when_showering')}}"
              action: climate.set_temperature
      default: []
    - wait_for_trigger:
        - entity_id: binary_sensor.bedroom_door
          to: "on"
          from: "off"
          trigger: state
      timeout:
        hours: 2
        minutes: 0
        seconds: 0
        milliseconds: 0
      continue_on_timeout: false
    - type: turn_on
      device_id: 4727b2015d290faf287bd1a335620fab
      entity_id: light.kitchen_counter
      domain: light
    - type: turn_on
      device_id: a634fea07a944853cfa4fe710f25fd04
      entity_id: light.kitchen_overhead
      domain: light
    - choose:
        - conditions:
            - condition: and
              conditions:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: binary_sensor.pixel_is_charging
                      state: "on"
                - condition: state
                  entity_id: binary_sensor.pixel_device_locked
                  state: "on"
          sequence:
            - data:
                media_content_id: amzn1.ask.skill.8e0fbda3-b70c-481d-878f-a2e5e17158c9
                media_content_type: skill
              target:
                entity_id:
                  - media_player.kitchen_echo_show
              action: media_player.play_media
            - data: {}
              target:
                entity_id: script.heat_coffee_water
              enabled: false
              action: script.turn_on
    - target:
        entity_id: media_player.bathroom_echo
      data: {}
      action: media_player.media_stop
    - wait_for_trigger:
        - value_template:
            "{{\n    is_state('binary_sensor.office_door', 'off')\n    and
            is_state('binary_sensor.public_space_motion', 'off')\n}}"
          id: in_office
          trigger: template
        - entity_id: binary_sensor.living_room_presence_presence_sensor_9
          from: "off"
          to: "on"
          id: in_livingroom
          trigger: state
      timeout: 02:00:00
      continue_on_timeout: false
    - choose:
        - conditions:
            - condition: template
              value_template: '{{wait.trigger.id == "in_office"}}'
          sequence:
            - target:
                entity_id: media_player.kitchen_echo_show
              data: {}
              action: media_player.media_stop
        - conditions:
            - condition: template
              value_template: '{{wait.trigger.id == "in_livingroom"}}'
          sequence:
            - target:
                entity_id: light.living_room_lamp
              data:
                transition: 6
                brightness: 255
              action: light.turn_on
            - target:
                entity_id: media_player.kitchen_echo_show
              data: {}
              action: media_player.media_stop
            - wait_for_trigger:
                - value_template:
                    "{{\n    is_state('binary_sensor.office_door', 'off')\n
                    \   and is_state('binary_sensor.public_space_motion', 'off')\n}}"
                  trigger: template
              timeout: 02:00:00
              continue_on_timeout: false
            - target:
                entity_id: light.living_room_lamp
              data:
                transition: 20
              action: light.turn_off
      default: []
    - condition: state
      entity_id: person.sarah
      state: not_home
    - data: {}
      entity_id: light.bedroom
      action: light.turn_off
  mode: single
- id: "1619291764637"
  alias: Motion -- Side Door
  description: ""
  use_blueprint:
    path: networkingcat/yet_another_motion_automation.yaml
    input:
      time_scene_night: 00:00:00
      motion_entity: binary_sensor.side_door_person
      light_target:
        entity_id:
          - light.side_porch
          - light.laundry_room
      elevation_check: 10
      time_scene_evening: 00:00:00
      time_scene_day: 0:00:00
      time_scene_morning: 0:00:00
      automation_blocker: input_boolean.people_outside
      time_scene_ambient_end: 0:00:00
      automation_blocker_boolean: false
      no_motion_wait: 300
- id: "1620332636293"
  alias: Low battery level detection & notification for all battery sensors
  description: ""
  use_blueprint:
    path: sbyx/low-battery-level-detection-notification-for-all-battery-sensors.yaml
    input:
      exclude:
        entity_id:
          - sensor.iphone_2_battery_state
          - sensor.iphone_2_battery_level
          - sensor.nathan_s_pixel_battery_level
          - sensor.pixel_battery_state
          - sensor.rooben_battery_level
          - sensor.google_pixel_watch_battery_level
          - sensor.deep_freezer_temperature_sensor_battery
          - sensor.freezer_temperature_battery
      actions:
        - service: script.notify_sarah_and_nathan
          data:
            message: Battery is Dying
            url: /lovelace/data
            use_alexa: false
            notify_nathan: true
            notify_sarah: false
            text_nathan: false
            text_sarah: false
            text_ice_contacts: false
            bypass_quiet_mode: false
            use_persistent_notification: true
            persistent_notification_id: dying_battery
            more_info: The battery is dying for {{ sensors }}
- id: "1620357325146"
  alias: Motion -- Back Yard
  description: ""
  use_blueprint:
    path: networkingcat/yet_another_motion_automation.yaml
    input:
      time_scene_night: 0:00:00
      motion_entity: binary_sensor.back_porch_motion
      elevation_check: 10
      time_scene_evening: 0:00:00
      time_scene_day: 0:00:00
      time_scene_morning: 0:00:00
      time_scene_ambient_end: 0:00:00
