- id: '1763586306958'
  alias: Eave Lights
  description: ''
  triggers:
  - event: sunset
    id: sunset
    offset: -01:00:00
    trigger: sun
  - entity_id: input_boolean.night_mode
    id: sleep
    to: 'on'
    from: 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    trigger: state
  - entity_id: binary_sensor.occupied
    id: occupation
    trigger: state
  - entity_id: input_boolean.night_mode
    id: wake
    from: 'on'
    to: 'off'
    trigger: state
  - at: 00:00:00
    id: midnight
    trigger: time
  - trigger: state
    entity_id:
    - input_select.eave_lights_scenes
    from:
    to:
    id: selected-scene-change
  - event: start
    trigger: homeassistant
    id: ha-start
  - trigger: calendar.event_started
    target:
      entity_id: calendar.holidays_in_united_states
    options:
      offset:
        hours: 4
        minutes: 0
        seconds: 0
        days: 2
      offset_type: before
    id: before-holiday
  - trigger: calendar.event_ended
    target:
      entity_id: calendar.holidays_in_united_states
    options:
      offset:
        hours: 19
        minutes: 0
        seconds: 0
        days: 0
      offset_type: after
    id: after-holiday
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id:
          - sunset
        - condition: and
          conditions:
          - condition: template
            value_template: '{{trigger.from_state | default(''None'') != ''None''}}'
          - condition: trigger
            id:
            - selected-scene-change
      sequence:
      - action: variable.update_sensor
        metadata: {}
        target:
          entity_id: sensor.last_eave_lights
        data:
          replace_attributes: false
          value: '{{states(''input_select.eave_lights_scenes'')}}'
      - action: light.turn_on
        metadata: {}
        data:
          effect: '{{states(''input_select.eave_lights_scenes'')}}'
        target:
          entity_id: light.eave_lights
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: sleep
        - condition: trigger
          id: midnight
      sequence:
      - data: {}
        enabled: true
        action: light.turn_off
        target:
          entity_id: light.eave_lights
    - conditions:
      - condition: trigger
        id:
        - ha-start
      sequence:
      - delay:
          hours: 0
          minutes: 5
          seconds: 0
          milliseconds: 0
        enabled: true
      - sequence:
        - variables:
            options: '{{state_attr(''light.eave_lights'', ''effect_list'')}}'
        - metadata: {}
          data:
            options: '{{options}}'
          target:
            entity_id:
            - input_select.eave_lights_scenes
          action: input_select.set_options
        - action: input_select.select_option
          metadata: {}
          target:
            entity_id: input_select.eave_lights_scenes
          data:
            option: "{% if states('sensor.last_eave_lights') in options %}\n  {{ states('sensor.last_eave_lights')
              }}\n{% else %}\n  Normal\n{% endif %}\n"
    - conditions:
      - condition: trigger
        id:
        - before-holiday
      sequence:
      - sequence:
        - action: ai_task.generate_data
          metadata: {}
          data:
            task_name: Holiday Scene Generation
            instructions: "{% set holiday = state_attr('calendar.holidays_in_united_states',
              'message') %}\n{% set scenes = state_attr('input_select.eave_lights_scenes',
              'options') %}\n\nUpcoming Holiday: {{ holiday }}\nAvailable Scene Options:
              {{ scenes }}\n\nTask: \n1. Identify the \"vibe\" or \"colors\" of this
              holiday.\n2. Find ALL scenes in the list that could reasonably fit that
              holiday. \n   - Example: For Easter, you might find ['Easter', 'Easter
              Egg', 'Candy', 'Spring', 'Flower Field'].\n   - Example: For a patriotic
              holiday, you might find ['Fireworks', 'Bright', 'Active'].\n   - Example:
              For Juneteenth, look for ['Colorful', 'Rainbow', 'Sunrise', 'Enthusiastic'].\n3.
              Randomly select ONE scene from your identified matches.\n4. If the holiday
              is obscure, make your best creative guess based on the name (e.g., 'Groundhog
              Day' -> 'Forest' or 'Earth')."
            structure:
              new_scene:
                description: 'The scene that was choses for the given holiday Rules:
                  - Respond ONLY with the exact string of the chosen scene. - No punctuation,
                  no quotes, no explanation. - ONLY if there is absolutely no creative
                  match, return ''Normal''."'
                required: true
                selector:
                  text:
              reasoning:
                description: Why the model made the scene choice for the given holiday
                required: true
                selector:
                  text:
            entity_id: ai_task.google_ai_task
          response_variable: ai_output
        - action: script.notify_sarah_and_nathan
          metadata: {}
          data:
            use_alexa: false
            use_persistent_notification: true
            notify_sarah: false
            notify_nathan: true
            text_nathan: false
            text_sarah: false
            text_garrett: false
            text_ice_contacts: false
            bypass_quiet_mode: false
            use_siren: false
            email_nathan: false
            print_receipt: false
            message: 'New Scene: {{ai_output.data.new_scene}}'
            more_info: 'Why: {{ai_output.data.reasoning}}'
        - action: input_select.select_option
          metadata: {}
          target:
            entity_id: input_select.eave_lights_scenes
          data:
            option: '{{ai_output.data.new_scene}}'
    - conditions:
      - condition: trigger
        id:
        - after-holiday
      - condition: template
        value_template: "{% set next_event = state_attr('calendar.holidays_in_united_states',
          'start_time') %}\n{{ next_event != None and \n   (as_timestamp(next_event)
          - now() | as_timestamp) >= (2 * 86400) }}\n"
      sequence:
      - action: input_select.select_option
        metadata: {}
        target:
          entity_id: input_select.eave_lights_scenes
        data:
          option: Normal
    default: []
  mode: queued
  max: 10
