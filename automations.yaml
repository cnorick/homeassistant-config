- id: wfh
  alias: Work from Home
  trigger:
    - platform: state
      entity_id: binary_sensor.is_during_workday
      from: "off"
      to: "on"
    - platform: state
      entity_id: input_boolean.wfh
      from: "off"
      to: "on"
    - platform: state
      entity_id: person.nathan
      from: not_home
      to: home
    - platform: state
      entity_id: person.sarah
      from: not_home
      to: home
    - platform: state
      entity_id: person.nathan
      from: home
      to: not_home
      id: nathan_left
    - platform: state
      entity_id: person.sarah
      from: home
      to: not_home
      id: sarah_left
    - platform: state
      entity_id: binary_sensor.occupied
      from: "off"
      to: "on"
    - platform: homeassistant
      event: start
    - platform: event
      event_type: automation_reloaded
  condition:
    - condition: state
      entity_id: input_boolean.wfh
      state: "on"
    - condition: state
      entity_id: binary_sensor.is_during_workday
      state: "on"
    - condition: state
      entity_id: binary_sensor.occupied
      state: "on"
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: nathan_left
          sequence:
            - service: homeassistant.turn_off
              target:
                area_id: a78dc9b8222b47eebe4561988e57b0b0
              data: {}
        - conditions:
            - condition: trigger
              id: sarah_left
          sequence:
            - service: homeassistant.turn_off
              target:
                area_id: b2672f722c53428e92427703040fb764
              data: {}
              enabled: false
      alias: Someone leaves during the workday
    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.is_morning
              state: "on"
          sequence:
            - choose:
                - conditions:
                    - condition: state
                      entity_id:
                        - person.sarah
                      state: home
                  sequence:
                    - service: scene.turn_on
                      target:
                        entity_id: scene.wfh_bedroom
                      data: {}
              enabled: false
              alias: Sarah Actions
            - choose:
                - conditions:
                    - condition: state
                      entity_id:
                        - person.nathan
                      state: home
                  sequence:
                    - service: scene.turn_on
                      target:
                        entity_id: scene.wfh
                      data: {}
                    - wait_for_trigger:
                        - platform: state
                          entity_id: binary_sensor.office_door
                          to: "off"
                          from: "on"
                      timeout: 03:00:00
                      continue_on_timeout: true
                    - service: media_player.media_stop
                      target:
                        entity_id: media_player.kitchen_echo_show
                      data: {}
                    - if:
                        - condition: state
