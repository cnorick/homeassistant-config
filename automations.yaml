    - conditions:
      - condition: trigger
        id: ease_on_lights
      sequence:
        service: script.turn_on
        target:
          entity_id:
          - script.slow_alarm
    - conditions:
      - condition: trigger
        id: play_alarm
      sequence:
        service: script.turn_on
        target:
          entity_id:
          - script.alarm
