        text_sarah: false
        text_garrett: false
        text_ice_contacts: false
        bypass_quiet_mode: false
        use_siren: false
        email_nathan: false
        message: "Meshtastic: \n{%- if trigger.event.data.data.from is defined and
          trigger.event.data.data.from == 3677053688 %} Christian\n{%- elif trigger.event.data.data.from
          is defined and trigger.event.data.data.from == 1607449222 %} Tater\n{%-
          elif trigger.event.data.data.from is defined and trigger.event.data.data.from
          == 1255561437 %} Baxter St.\n{%- elif trigger.event.data.data.from is defined
          and trigger.event.data.data.from == 3127548364 %} pbot\n{%- elif trigger.event.data.data.from
          is defined and trigger.event.data.data.from == 1607449222 %} Garrett\n{%-
          else %} {{trigger.event.data.data.from}}\n{%- endif %}\nto\n{%- if trigger.event.data.data.to
          is defined and trigger.event.data.data.to.node == 819691296 %} TREE\n{%-
          elif trigger.event.data.data.to is defined and trigger.event.data.data.to.channel
          == 0 %} LongFast\n{%- elif trigger.event.data.data.to is defined and trigger.event.data.data.to.channel
          == 1 %} PinePrivate\n{%- elif trigger.event.data.data.to is defined and
          trigger.event.data.data.to.channel is defined %} Channel {{ trigger.event.data.data.to.channel
          }}\n{%- elif trigger.event.data.data.to is defined and trigger.event.data.data.to.node
          is defined %} Node {{ trigger.event.data.data.to.node }}\n{%- else %} {{trigger.event.data.data.to}}\n{%-
          endif -%}"
        more_info: '{{trigger.event.data.data.message}}'
