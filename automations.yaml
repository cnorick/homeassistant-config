        state: 'off'
    then:
    - data: {}
      target:
        entity_id: input_boolean.keep_ac_in_eco
      action: input_boolean.turn_off
    - target:
        entity_id: climate.kitchen
      data:
        preset_mode: none
      enabled: true
      action: climate.set_preset_mode
  - data: {}
    enabled: false
