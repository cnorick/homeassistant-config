- id: '1604755622229'
  alias: Notify When There Is Mail
  description: Sends a notification to everyone when there is mail to be checked.
  triggers:
  - entity_id:
    - binary_sensor.mailbox_vibration
    to: 'on'
    id: vibration
    trigger: state
  - at: 00:00:00
    id: midnight
    trigger: time
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.imap_gmail_com_mail_usps_mail
        above: '0'
      - condition: state
        entity_id: input_boolean.night_mode
        state: 'off'
      - condition: state
        entity_id:
        - input_boolean.mail_in_box
        state: 'off'
      - condition: trigger
        id: vibration
      sequence:
      - sequence:
        - data:
            message: Mail Time
            use_alexa: true
            notify_nathan: false
            notify_sarah: false
            text_nathan: false
            text_sarah: false
            text_ice_contacts: false
            bypass_quiet_mode: false
          action: script.notify_sarah_and_nathan
        - entity_id: input_boolean.mail_in_box
          action: input_boolean.turn_on
        - action: ai_task.generate_data
          data:
            task_name: Summarize Daily USPS Mail
            instructions: "You are a helpful smart home assistant summarizing the
              daily mail delivery. \nToday, we are receiving {{ states('sensor.imap_gmail_com_mail_usps_mail')
              }} pieces of mail.\nPlease carefully review the attached image grid
              showing today's mail and provide the information requested in the structured
              output fields.\nGuidelines for your summary:  * Prioritize and highlight
              any \"out of the ordinary\" mail. This includes handwritten envelopes,
              personal correspondence (especially anything addressed to Nathan, Sarah,
              or Jude), or non-routine letters/bills. * Identify standard monthly
              utilities (e.g., BrightRidge, Atmos Energy, City of Johnson City) but
              treat them as routine.  * Group obvious junk mail, generic flyers, or
              mass-market presorted mail together (e.g., \"Plus 3 pieces of standard
              junk mail\").  * If the scans are blurry or a sender is illegible, do
              not guess or hallucinate the name. Simply note that there is a piece
              of mail from an unrecognizable sender."
            attachments:
            - media_content_id: media-source://media_source/www/mail_and_packages/{{
                states('sensor.imap_gmail_com_mail_grid_image_path').split('/')[-1]
                }}
              media_content_type: image/png
            structure:
              title:
                description: 'A super brief, dynamic notification title (max 5-7 words)
                  highlighting the most important or interesting piece of mail. (e.g.,
                  ''Mail: Electric Bill & 2 Flyers'')'
                selector:
                  text: {}
              more_info:
                description: A short, glanceable list of all the delivery items formatted
                  as a single, comma-separated list. Group junk together and note
                  specific senders. e.g. Letter from Donna for Nathan, Bill from Brightridge,
                  2 pieces of junk
                selector:
                  text:
                    multiline: true
          response_variable: mail_summary
        - action: script.notify_sarah_and_nathan
          data:
            message: '{{ mail_summary.data.title }}'
            more_info: '{{ mail_summary.data.more_info }}'
            url: /lovelace/mail
            image: '{{ states(''sensor.imap_gmail_com_mail_image_url'') }}'
            use_alexa: false
            notify_nathan: true
            notify_sarah: true
            text_nathan: false
            text_sarah: false
            text_ice_contacts: false
            bypass_quiet_mode: false
    default:
    - entity_id: input_boolean.mail_in_box
      action: input_boolean.turn_off
  mode: single
