- id: '1587438080867'
  alias: Kitchen Presence
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.kitchen_presence_sensor_presence_sensor_1
    to: 'on'
    id: kitchen-presence-on
    trigger: state
  - entity_id:
    - binary_sensor.bedroom_door
    to: 'on'
    id: bedroom-door-open
    trigger: state
  - entity_id:
    - binary_sensor.kitchen_presence_sensor_presence_sensor_1
    to: 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 30
    id: kitchen-presence-off
    trigger: state
  - entity_id:
    - binary_sensor.kitchen_presence_sensor_presence_sensor_5
    to: 'on'
    id: sink-presence-on
    trigger: state
  - at: 03:00:00
    id: new-day
    trigger: time
  - entity_id:
    - binary_sensor.kitchen_presence_sensor_presence_sensor_2
    to: 'on'
    id: fridge-presence-on
    trigger: state
  - entity_id:
    - binary_sensor.presence_sensor_fp2_d35b_presence_sensor_9
    to: 'on'
    id: ipad-on
    trigger: state
  - entity_id:
    - binary_sensor.kitchen_presence_sensor_presence_sensor_3
    to: 'on'
    id: microwave-on
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.night_mode
        state: 'on'
      - condition: trigger
        id:
        - kitchen-presence-on
        - bedroom-door-open
      alias: kitchen motion at night
      sequence:
      - data: {}
        target:
          entity_id: light.kitchen_counter
        action: light.turn_on
    - conditions:
      - condition: trigger
        id:
        - kitchen-presence-on
      - condition: state
        entity_id: input_boolean.night_mode
        state: 'off'
      alias: kitchen motion at day
      sequence:
      - data: {}
        target:
          entity_id: group.kitchen_lights
        action: homeassistant.turn_on
    - conditions:
      - condition: trigger
        id:
        - kitchen-presence-off
      sequence:
      - data: {}
        target:
          area_id: 1f75029558cd46f69ddb7d3a9f537726
        action: light.turn_off
    - conditions:
      - condition: trigger
        id:
        - sink-presence-on
      - condition: time
        after: '21:00:00'
        before: '23:59:00'
        enabled: true
      - condition: state
        entity_id: input_boolean.night_mode
        state: 'off'
      - condition: state
        entity_id: binary_sensor.water_drip_notification_done
        state: 'off'
        enabled: true
      sequence:
      - alias: Reminder to let water drip
        sequence:
        - action: weather.get_forecasts
          metadata: {}
          data:
            type: hourly
          target:
            entity_id: weather.home
          response_variable: forecasts
        - variables:
            lowest_temp_entry: "{% set next_sunrise = states('sensor.sun_next_rising')
              %} {% set forecasts = forecasts['weather.home']['forecast'] %} {{ forecasts
              \n   | selectattr('datetime', 'lt', next_sunrise) \n   | map(attribute='temperature')
              \n   | min }}\n"
        - alias: Reminder to Let Water Drip
          choose:
          - conditions:
            - condition: template
              value_template: '{{lowest_temp_entry < 32}}'
            sequence:
            - data:
                data:
                  type: tts
                message: Don't forget to let the water drip. The low for tonight is
                  {{lowest_temp_entry}}
                target: media_player.kitchen_echo_show
              action: notify.alexa_media
            - data:
                replace_attributes: false
                value: 'true'
              target:
                entity_id: binary_sensor.water_drip_notification_done
              action: variable.update_binary_sensor
    - conditions:
      - condition: trigger
        id:
        - new-day
      sequence:
      - data:
          replace_attributes: false
          value: 'false'
        target:
          entity_id: binary_sensor.water_drip_notification_done
        action: variable.update_binary_sensor
    default: []
- id: bathroom_on_motion
  alias: Toggle Bathroom on Motion
  description: ''
  trigger:
  - entity_id: binary_sensor.apollo_msr_2_f8ee88_radar_target
    platform: state
    to: 'on'
  condition: []
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.night_mode
        state: 'off'
      sequence:
      - service: script.tier_toggle_devices
        data:
          action: true
          entity_1:
            entity_id: light.bath_1
          entity_2:
            entity_id: light.bath_2
          entity_3:
            entity_id: light.bath_3
          entity_4:
            entity_id: light.bath_4
          entity_5:
            entity_id: light.bath_5
          entity_6:
            entity_id: light.bath_6
          entity_7:
            entity_id: light.bath_ceiling
          delay: 250
    - conditions:
      - condition: state
        entity_id: input_boolean.night_mode
        state: 'on'
      - condition: state
        entity_id: light.bathroom
        state: 'off'
      sequence:
      - service: scene.turn_on
        entity_id: scene.bathroom_night
  - service: scene.turn_on
    data_template:
      entity_id: '{% if is_state("input_boolean.night_mode", "on") %} scene.bathroom_night
        {% else %} scene.bathroom_day {% endif %}'
    enabled: false
  - wait_for_trigger:
    - platform: state
      entity_id: binary_sensor.apollo_msr_2_f8ee88_radar_target
      to: 'off'
      for:
        seconds: '{% set pee_timeout = states(''input_number.pee_timeout'') | int
          * 60 %} {% set poo_timeout = states(''input_number.poo_timeout'') | int
          * 60 %} {% set night_timeout = states(''input_number.night_timeout'') |
          int * 60 %} {% if is_state("binary_sensor.bathroom_door", "off") %} {% set
          action = "poo" %} {% else %} {% set action = "pee" %} {% endif %} {% if
          action == "poo" %} {{ poo_timeout }} {% elif is_state(''input_boolean.night_mode'',
          ''on'') %} {{ night_timeout }} {% else %} {{ pee_timeout }} {% endif %}'
    timeout: 3600
    continue_on_timeout: true
  - service: script.tier_toggle_devices
    data:
      action: false
      entity_1:
        entity_id: light.bath_1
      entity_2:
        entity_id: light.bath_2
      entity_3:
        entity_id: light.bath_3
      entity_4:
        entity_id: light.bath_4
      entity_5:
        entity_id: light.bath_5
      entity_6:
        entity_id: light.bath_6
      entity_7:
        entity_id: light.bath_ceiling
      delay: 1000
