- id: '1743600656177'
  alias: Mealie
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - calendar.mealie_dinner
    id: mealplan-update
  - trigger: time_pattern
    minutes: /1
    id: 5-minutes
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - mealplan-update
        - 5-minutes
      sequence:
      - sequence:
        - action: mealie.get_mealplan
          metadata: {}
          data:
            config_entry_id: 01JQV7H0NCEG91ZWHK91VJESNW
            start_date: '{{(now() - timedelta(days=now().isoweekday() % 7)) | as_timestamp
              | timestamp_custom(''%Y-%m-%d'')}}'
            end_date: '{{(now() + timedelta(days=(7+6 - now().isoweekday()%7))) |
              as_timestamp | timestamp_custom(''%Y-%m-%d'')}}'
          response_variable: mealplan
        - variables:
            mealplans_json: "[ {% for meal in mealplan.mealplan | rejectattr(\"recipe\",
              \"undefined\") %} {%- if meal.recipe | default -%} {\n  \"id\": \"{{meal.recipe.recipe_id
              | default}}\",\n  \"name\": \"{{meal.recipe.name | default}}\",\n  \"image\":
              \"http://192.168.5.9:9000/api/media/recipes/{{meal.recipe.recipe_id
              | default}}/images/original.webp\",\n  \"external_image\": \"https://mealie.nathanorick.com/api/media/recipes/{{meal.recipe.recipe_id
              | default}}/images/original.webp\",\n  \"description\": {{ (meal.recipe.description
              | default) | to_json }},\n  \"url\": \"https://mealie.nathanorick.com/g/home/r/{{meal.recipe.slug
              | default}}\"\n}{% if not loop.last %},{% endif %} {%endif%} {%endfor%}
              ]"
            mealplans: '{{mealplans_json | to_json | from_json}}'
            markdown: '| Recipe | Image | Description |

              | ------ | ----- | ----------- |

              {% for meal in mealplans -%}

              | [{{meal.name | default }}]({{meal.url}}) | <img src="{{meal.image}}"
              width="400"/> | {{ meal.description }} |

              {%- endfor %}

              '
            existing_ids: '{{ state_attr(''sensor.meal_plan'', ''mealplan'') | map(attribute=''id'')
              | list if state_attr(''sensor.meal_plan'', ''mealplan'') is not none
              else [] }}'
            new_meal_indices: "{% set ns = namespace(indices=[]) %} {% for meal in
              mealplans %}\n  {% if meal.id not in existing_ids %}\n    {% set ns.indices
              = ns.indices + [loop.index0] %}\n  {% endif %}\n{% endfor %} {{ ns.indices
              }}"
        - action: variable.update_sensor
          metadata: {}
          data:
            replace_attributes: true
            attributes:
              mealplan: '{{mealplans}}'
              markdown: '{{markdown}}'
            value: '{{mealplans | length | int(0)}}'
          target:
            entity_id: sensor.meal_plan
        - repeat:
            for_each: '{{ new_meal_indices }}'
            sequence:
            - action: script.send_recipe
              metadata: {}
              data:
                recipe_index: '{{repeat.item}}'
                print_recipe: true
      alias: Update variables
  mode: single
