- sensor:
    - name: Number of People at Home
      unique_id: "number_of_people_at_home"
      state: >-
        {{ dict((states.person)|groupby('state'))['home']|count }}
- sensor:
    - name: Last Number of People at Home
      unique_id: "last_number_of_people_at_home"
      state: >-
        {{ trigger.from_state.state }}
  trigger:
    - platform: state
      entity_id: sensor.number_of_people_at_home
- binary_sensor:
    - name: Back Yard Floodlight Motion
      state: >-
        {{states("input_boolean.alexa_back_yard_floodlight_motion")}}
      device_class: motion
- binary_sensor:
    - name: Parking Pad Floodlight Motion
      state: >-
        {{states("input_boolean.alexa_parking_pad_floodlight_motion")}}
      device_class: motion
- sensor:
    - name: clean_tesla_wall_connector_energy
      unit_of_measurement: kWh
      state: >-
        {% set data_source = states('sensor.tesla_wall_connector_energy') %}
        {% if data_source in ['unavailable', 'unknown'] %} 
          {{this.state | default('unavailable')}}
        {% else %}
          {{data_source}}
        {% endif %}
- sensor:
    - name: Tesla Energy Added At Home
      unit_of_measurement: kWh
      state: >-
        {% if trigger.id == "unplugged" %}
          {% if is_state("device_tracker.tesleigh_lynn_location", "home") %}
            {{states('sensor.tesla_energy_added_at_home') | float(0) + states('sensor.tesleigh_lynn_charge_energy_added') | float(0)}}
          {% else %}
            {{states('sensor.tesla_energy_added_at_home') | float(0)}}
          {% endif %}
        {% elif trigger.id == "left" %}
          {% if states.binary_sensor.tesleigh_lynn_charge_cable.last_changed + timedelta(minutes=1) >= now() and is_state('binary_sensor.tesleigh_lynn_charge_cable', 'off') %}
            {{states('sensor.tesla_energy_added_at_home') | float(0) + states('sensor.tesleigh_lynn_location') | float(0)}}
          {% else %}
            {{states('sensor.tesla_energy_added_at_home') | float(0)}}
          {% endif %}
        {% endif %}
  trigger:
    - platform: state
      entity_id: binary_sensor.tesleigh_lynn_charge_cable
      id: unplugged
      from: "on"
      to: "off"
    - platform: state
      entity_id: device_tracker.tesleigh_lynn_location
      id: left
      from: "home"
- sensor:
    - name: Tesla Home Monthly Charging Cost
      unit_of_measurement: $
      state: >-
        {{((states("sensor.tesla_home_charging") | float) * (states("sensor.brightridge_electricity_price") | float)) | round(2)}}
- sensor:
    - name: Energy Added at Rusty and Donna's
      unit_of_measurement: kWh
      state: >-
        {% if trigger.id == "unplugged" %}
          {% if is_state("device_tracker.tesleigh_lynn_location", "Donna and Rusty's") %}
            {{states('sensor.energy_added_at_rusty_and_donna_s') | float(0) + states('sensor.tesleigh_lynn_charge_energy_added') | float(0)}}
          {% else %}
            {{states('sensor.energy_added_at_rusty_and_donna_s') | float(0)}}
          {% endif %}
        {% elif trigger.id == "left" %}
          {% if states.binary_sensor.tesleigh_lynn_charge_cable.last_changed + timedelta(minutes=1) >= now() and is_state('binary_sensor.tesleigh_lynn_charge_cable', 'off') %}
            {{states('sensor.energy_added_at_rusty_and_donna_s') | float(0) + states('sensor.tesleigh_lynn_charge_energy_added') | float(0)}}
          {% else %}
            {{states('sensor.energy_added_at_rusty_and_donna_s') | float(0)}}
          {% endif %}
        {% endif %}
  trigger:
    - platform: state
      entity_id: binary_sensor.tesleigh_lynn_charge_cable
      id: unplugged
      from: "on"
      to: "off"
    - platform: state
      entity_id: device_tracker.tesleigh_lynn_location
      id: left
      from: "Donna and Rusty's"
- sensor:
    - name: Weekly Charging Cost at Rusty and Donna's
      unit_of_measurement: $
      state: >-
        {{((states("sensor.tesla_rusty_and_donna_s_charging") | float) * (states("sensor.brightridge_electricity_price") | float)) | round(2)}}
- sensor:
    - name: Last Week's Charging Cost at Rusty and Donna's
      unit_of_measurement: $
      state: >-
        {{states('sensor.weekly_charging_cost_at_rusty_and_donna_s')}}
  trigger:
    - platform: template
      value_template: >-
        {{(states('sensor.date_time_iso') | as_datetime).weekday() == 6 and (states('sensor.date_time_iso') | as_datetime).hour == 23}}
- sensor:
    - name: Home Charging Cost Last Month
      unit_of_measurement: $
      state: >-
        {{states('sensor.tesla_home_monthly_charging_cost')}}
  trigger:
    - platform: template
      value_template: >-
        {% set dt = now() %}
        {% set lastDayOfMonth = (dt.replace(month=dt.month % 12 + 1, day=1) - timedelta(days=1)).day %}
        {{(states('sensor.date_time_iso') | as_datetime).day == lastDayOfMonth and (states('sensor.date_time_iso') | as_datetime).hour == 23}}
- sensor:
    - name: Others Charging at Home Cost Last Month
      unit_of_measurement: $
      state: >-
        {{states('sensor.others_charging_at_home_total_monthly_cost')}}
  trigger:
    - platform: template
      value_template: >-
        {% set dt = now() %}
        {% set lastDayOfMonth = (dt.replace(month=dt.month % 12 + 1, day=1) - timedelta(days=1)).day %}
        {{(states('sensor.date_time_iso') | as_datetime).day == lastDayOfMonth and (states('sensor.date_time_iso') | as_datetime).hour == 23}}
- sensor:
    - name: Wall Charger Monthly Charging Cost
      unit_of_measurement: $
      state: >-
        {{((states("sensor.wall_charger_total_monthly_energy") | float) * (states("sensor.brightridge_electricity_price") | float)) | round(2)}}
- sensor:
    - name: Others Charging at Home Total Monthly Energy
      unit_of_measurement: kWh
      state: >-
        {{(states('sensor.wall_charger_total_monthly_energy') | float) - states('sensor.tesla_home_charging') | float}}
- sensor:
    - name: Others Charging at Home Total Monthly Cost
      unit_of_measurement: $
      state: >-
        {{((states("sensor.others_charging_at_home_total_monthly_energy") | float) * (states("sensor.brightridge_electricity_price") | float)) | round(2)}}
- sensor:
    - name: Monthly Electric Cost
      unit_of_measurement: $
      state: >-
        {{((states("sensor.monthly_energy_usage") | float) * (states("sensor.brightridge_electricity_price") | float)) | round(2)}}

- trigger:
    - platform: event
      event_type: event_template_reloaded
      id: refresh
    - platform: homeassistant
      event: start
      id: refresh
    - platform: time_pattern
      minutes: "/1"
  action:
    - variables:
        result: >
          {% from 'interpolate.jinja' import value_to_range %}
          {% set CO2 = [420,800,900,1000,2000,2500] %}
          {% set CO  = [0.0, 3.0, 4.0, 5.0, 10.0, 15.0] %}
          {% set NO2 = [0.0, 0.0, 0.1, 0.2, 0.25, 0.3] %}
          {% set PM  = [0,30,60,100,200,400] %}
          {% set PMda= [0,10,15,20,25,30] %}
          {% set VOC = [0,80,120,250] %}
          {% set NOx = [0,100,200,300,400] %}
          {% set results = [
            (value_to_range(states('sensor.apollo_air_1_8941f4_co2') | int(0), CO2),'CO2'),
            (value_to_range(states('sensor.apollo_air_1_8941f4_carbon_monoxide') | float(0), CO),'CO'),
            (value_to_range(states('sensor.apollo_air_1_8941f4_nitrogen_dioxide') | float(0), NO2),'NO2'),
            (value_to_range(states('sensor.apollo_air_1_8941f4_pm_2_5_m_weight_concentration') | float(0), PM),'PM'),
            (value_to_range(states('sensor.pm2_5_daily_average') | float(0), PMda),'PMda'),
            (value_to_range(states('sensor.apollo_air_1_8941f4_sen55_voc') | int (0), VOC),'VOC'),
            (value_to_range(states('sensor.apollo_air_1_8941f4_sen55_nox') | int (0), NOx),'NOx')
            ] %}
          {{ (results | sort) | last }}
        index: "{{ result[0] | float(0) }}"
    # - sequence:
    #     - service: light.turn_on
    #       target:
    #         entity_id: light.apollo_air_1_8941f4_rgb_light
    #       data:
    #         rgb_color: >
    #           {% from 'interpolate.jinja' import range_to_value %}
    #           {%- set red  = [  0,200,238,255,255,255] -%}
    #           {%- set green= [255,255,255,225,127,  0] -%}
    #           {%- set blue = [ 25,  0,  0,  0,  0, 25] -%}
    #           {%- set targetRGB = 
    #             [range_to_value(index, red)|int(0),
    #             range_to_value(index, green)|int(0),
    #             range_to_value(index, blue)|int(0)
    #             ] -%}
    #           {{ targetRGB }}
    #         brightness: >
    #           {% from 'interpolate.jinja' import range_to_value %}
    #           {% set brightness = [30,40,50,100,180,255,255] %}
    #           {{ range_to_value(index,brightness) }}
    #         effect: >
    #           {% set effect = ['none','Slow Pulse','Fast Pulse'] %}
    #           {{ effect[0] if index < 3.5 else 
    #              effect[1] if index < 4.2 else
    #              effect[2] }}
  sensor:
    - name: Air Quality Index inside
      unique_id: air_quality_index_1
      state: "{{ index }}"
      device_class: aqi
      attributes:
        status: >
          {% set mapper = {0: 'Excellent',
                           1: 'Good',
                           2: 'Fair',
                           3: 'Weak',
                           4: 'Poor',
                           5: 'Terrible'} %}
          {{ mapper[index|int(0)] }}
        dominant: "{{ result[1] }}"

- binary_sensor:
  - device_class: occupancy
    default_entity_id: binary_sensor.occupied
    name: Home Occupancy
    state: >-
      {{ is_state('person.sarah', 'home')
      or is_state('person.nathan', 'home') }}

- binary_sensor:
  - default_entity_id: binary_sensor.is_workday
    state: >-
      {{
        is_state('binary_sensor.is_workday', 'on')
        and states('sensor.time') > states('input_datetime.work_start_time').rsplit(':',1)[0]
        and states('sensor.time') < states('input_datetime.work_end_time').rsplit(':',1)[0]
      }}
    name: is_workday

- binary_sensor:
  - default_entity_id: binary_sensor.is_during_workday
    state: >-
      {{ 
        is_state('binary_sensor.is_workday', 'on')
        and states('sensor.time') > states('input_datetime.work_start_time').rsplit(':',1)[0]
        and states('sensor.time') < states('input_datetime.work_end_time').rsplit(':',1)[0]
      }}
    name: is_during_workday

- binary_sensor:
  - default_entity_id: binary_sensor.is_morning
    state: >-
      {{
        as_timestamp(strptime(states('sensor.time'), '%H:%M')) + 600
        < as_timestamp(strptime(states('input_datetime.lunch_time'), '%H:%M:%S'))
      }}
    name: is_morning

- binary_sensor:
  - default_entity_id: binary_sensor.is_lunch
    state: >-
      {{
        as_timestamp(strptime(states('sensor.time'), '%H:%M')) + 600
        >= as_timestamp(strptime(states('input_datetime.lunch_time'), '%H:%M:%S'))
        and
        as_timestamp(strptime(states('sensor.time'), '%H:%M')) + 600
        < as_timestamp(strptime(states('input_datetime.lunch_time'), '%H:%M:%S')) + 3600
      }}
    name: is_lunch

- binary_sensor:
  - default_entity_id: binary_sensor.is_afternoon
    state: >-
      {{
        as_timestamp(strptime(states('sensor.time'), '%H:%M')) + 600
        >= as_timestamp(strptime(states('input_datetime.lunch_time'), '%H:%M:%S')) + 3600
        and
        as_timestamp(strptime(states('sensor.time'), '%H:%M')) + 600
        < as_timestamp(strptime(states('input_datetime.work_end_time'), '%H:%M:%S'))
      }}
    name: is_afternoon

- binary_sensor:
  - default_entity_id: binary_sensor.is_evening
    state: >-
      {{
        as_timestamp(strptime(states('sensor.time'), '%H:%M')) + 600
        >= as_timestamp(strptime(states('input_datetime.work_end_time'), '%H:%M:%S'))
      }}
    name: is_evening

- binary_sensor:
  - default_entity_id: binary_sensor.everyone_in_bed
    state: >-
      {{ 
        (
          is_state('binary_sensor.public_space_motion', 'off')
          and states('sensor.timestamp') | float >= (states.binary_sensor.public_space_motion.last_changed | as_timestamp) + 600
        )
        and is_state('binary_sensor.bedroom_door', 'off')
        and is_state('binary_sensor.occupied', 'on')
        and (
          is_state('input_boolean.visitors', 'off')
          or (
            is_state('input_boolean.visitors', 'on') and (is_state('binary_sensor.office_door', 'off') or True)
          )
        )
        and is_state('binary_sensor.is_bedtime', 'on')
        and is_state('group.bedroom_lights', 'off')
        and (
          is_state('input_boolean.visitors', 'off')
          or (
            is_state('input_boolean.visitors', 'on') and is_state('light.office', 'off')
          )
        )
      }}
    name: everyone_in_bed

- binary_sensor:
  - device_class: occupancy
    default_entity_id: binary_sensor.are_master_bedroom_people_home
    name: Are Sarah and Nathan Home
    state: >-
      {{ 
        is_state('person.sarah', 'home')
        or is_state('person.nathan', 'home')
      }}

- binary_sensor:
  - device_class: motion
    default_entity_id: binary_sensor.public_space_motion
    name: Public Space Motion
    state: >-
      {{ 
        is_state('binary_sensor.living_room_presence_presence_sensor_1', 'on')
        or is_state('binary_sensor.kitchen_presence_sensor_presence_sensor_1', 'on')
        or is_state('binary_sensor.wyze_motion4', 'on')
        or is_state('binary_sensor.laundry_room_motion', 'on')
        or is_state('binary_sensor.basement_motion_sensor', 'on')
      }}

- binary_sensor:
  - default_entity_id: binary_sensor.is_bedtime
    name: Is Bedtime
    state: >-
      {{
        states('sensor.time') > states('input_datetime.bedtime')
        or states('sensor.time') < states('input_datetime.morning')
      }}

# This just simply tracks the template switch. It's here so Alexa
# can make a routine to turn off the physical switch
- binary_sensor:
  - device_class: door
    default_entity_id: binary_sensor.guest_air_freshener
    name: Guest Air Freshener
    state: '{{ is_state(''switch.guest_air_freshener'', ''on'') }}'

- binary_sensor:
  - default_entity_id: binary_sensor.nws_alerts_are_active
    icon: >-
      {% if states('sensor.nws_alerts') | int(0) > 0 %}
        mdi:weather-lightning
      {% else %}
        mdi:weather-sunny
      {% endif %}
    name: NWS Alerts Are Active
    state: '{{ states(''sensor.nws_alerts'') | int(0) > 0 }}'

- sensor:
  - default_entity_id: sensor.timestamp
    state: '{{ states(''sensor.date_time_iso'') and now() | as_timestamp }}'
    name: timestamp

- switch:
  - turn_on:
    - data:
        entity_id: var.guest_air_freshener
        value: 'on'
      action: var.set
    turn_off:
    - data:
        entity_id: var.guest_air_freshener
        value: 'off'
      action: var.set
    default_entity_id: switch.guest_air_freshener
    icon: '{% if is_state(''var.guest_air_freshener'', ''on'') %} mdi:flower-tulip
      {% else %} mdi:flower-tulip-outline {% endif %}'
    name: Guest Air Freshener
    state: '{{ is_state(''var.guest_air_freshener'', ''on'') }}'