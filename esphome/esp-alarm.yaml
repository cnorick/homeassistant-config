esphome:
  name: esp-siren
  friendly_name: ESP Siren

esp32:
  board: esp32dev
  framework:
    type: esp-idf

esp32_ble:
  io_capability: keyboard_only

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "Q7XXMv0Pif99Z7Wlw2KzfG/XjLJjj7QAbRJLaZQ0o3M="

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp-Siren Fallback Hotspot"
    password: !secret ap_password

captive_portal:

button:
  - platform: restart
    name: "Restart Siren"

switch:
  - platform: gpio
    id: siren
    pin: 
      number: 4
      mode:
        output: true
        pulldown: true
    name: "ESP Siren"
    icon: "mdi:alarm-light"
    on_turn_on:
      then:
        - while:
            condition:
              switch.is_on: siren
            then:
            - light.toggle: onboard_led
            - delay: 400ms

    on_turn_off: 
      then:
        - light.turn_off: 
            id: onboard_led

output:
  - platform: gpio
    pin: 2
    id: onboard_led_output

light:
  - platform: binary
    internal: True
    id: onboard_led
    name: "Siren LED"
    output: onboard_led_output

